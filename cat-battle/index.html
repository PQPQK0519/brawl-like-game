<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ねこ大戦・オリジナル</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><h1>🐱 ねこ大戦・オリジナル</h1><div>XP <b id="xp">0</b></div><div>🐟 ネコ缶 <b id="gems">300</b></div><div>⚡ <b id="money">150</b>/600</div><button id="gachaOpen" class="topbtn">🎟 ガチャ</button></header><main><div class="stage"><canvas id="battle" width="1200" height="600"></canvas><div id="toast">ユニットを出撃させよう！</div></div><section class="deck"><button data-u="cat">🐱<span>ねこ</span><small>50</small></button><button data-u="shield">🛡️<span>かべねこ</span><small>75</small></button><button data-u="spear">⚔️<span>やりねこ</span><small>125</small></button><button data-u="mage">✨<span>魔法ねこ</span><small>200</small></button><button data-u="ninja">🥷<span>忍びねこ</span><small>🔒 ガチャ</small></button><button data-u="dragon">🐲<span>竜ねこ</span><small>🔒 ガチャ</small></button><button id="pause">Ⅱ</button><button id="reset">↻</button></section></main><footer>1〜4キーで出撃　・　ガチャで新キャラを解放　・　オリジナル素材のゲーム</footer></div><div id="gachaModal" class="modal hidden"><div class="gachaCard"><button id="gachaClose" class="close">×</button><h2>🎟 ねこガチャ</h2><p class="gachaSub">ネコ缶でキャラをゲット！重複するとレベルアップ。</p><div class="capsule">🐾</div><div id="gachaResult" class="result">ガチャを引いてみよう！</div><div class="gachaBtns"><button id="pull1">1回引く <b>100 🐟</b></button><button id="pull10">10連ガチャ <b>900 🐟</b></button></div><div class="collection"><h3>所持キャラ</h3><div id="collectionList"></div></div></div></div><script src="game.js"></script></body></html>
