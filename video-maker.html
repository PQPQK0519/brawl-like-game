<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>動画制作スタジオ</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#fff;font-family:Arial,sans-serif;padding:20px}.wrap{max-width:900px;margin:auto;background:#1f2937;border-radius:20px;padding:20px;box-shadow:0 15px 50px #0008}h1{margin-top:0}label{display:block;font-weight:bold;margin:12px 0 5px}input,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #ffffff25;background:#111827;color:#fff}textarea{min-height:80px}.scene{display:grid;grid-template-columns:1fr 100px;gap:8px;margin:8px 0}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}button{border:0;border-radius:12px;padding:12px 18px;background:#ff3158;color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#374151}canvas{width:100%;margin-top:15px;border-radius:14px;background:#000}.status{min-height:25px;margin-top:10px;font-weight:bold}</style></head><body><div class="wrap"><h1>🎬 YOUTUBER 動画制作スタジオ</h1><p>タイトル・字幕・シーンを作って、ブラウザだけで動画を書き出せます。</p><label>動画タイトル</label><input id="title" value="今日の撮影がヤバすぎた！"><label>説明欄</label><textarea id="desc">YOUTUBER VIRAL RUSHで撮影したオリジナル動画！</textarea><label>シーン（秒数も設定できます）</label><div id="scenes"></div><button class="secondary" id="add">＋ シーン追加</button><canvas id="preview" width="1280" height="720"></canvas><div class="buttons"><button id="play">▶ プレビュー</button><button id="export">⬇️ 動画を書き出す</button><button class="secondary" onclick="location.href='index.html'">🎮 ゲームに戻る</button></div><div class="status" id="status"></div></div><script>const defaults=[['今日の撮影スタート！',3],['ネタを集めてバズらせろ！',4],['チャンネル登録よろしく！',3]];let scenes=JSON.parse(localStorage.getItem('videoScenes')||'null')||defaults.map(x=>({text:x[0],duration:x[1]}));const box=document.getElementById('scenes'),cv=document.getElementById('preview'),x=cv.getContext('2d');function save(){localStorage.setItem('videoScenes',JSON.stringify(scenes))}function render(){box.innerHTML='';scenes.forEach((s,i)=>{const row=document.createElement('div');row.className='scene';const a=document.createElement('input');a.value=s.text;const b=document.createElement('input');b.type='number';b.min=1;b.max=30;b.value=s.duration;row.append(a,b);box.append(row);a.oninput=()=>{scenes[i].text=a.value;save()};b.oninput=()=>{scenes[i].duration=Math.max(1,Math.min(30,+b.value||1));save()}})}function draw(s,p){let w=cv.width,h=cv.height,g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#18234a');g.addColorStop(1,'#ff3158');x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.font='bold 58px Arial';let words=s.text.split(' '),line='',lines=[];for(const word of words){let t=line?line+' '+word:word;if(x.measureText(t).width>w-180){lines.push(line);line=word}else line=t}if(line)lines.push(line);let y=h/2-(lines.length-1)*40;lines.forEach((z,i)=>x.fillText(z,w/2,y+i*80));x.font='bold 25px Arial';x.globalAlpha=.8;x.fillText(document.getElementById('title').value,w/2,h-65);x.globalAlpha=1;x.fillStyle='#ffffff55';x.fillRect(0,h-10,w,10);x.fillStyle='#fff';x.fillRect(0,h-10,w*p,10)}let busy=false;async function make(previewOnly){if(busy)return;busy=true;const stream=cv.captureStream(30),mime=['video/webm;codecs=vp9','video/webm'].find(v=>MediaRecorder.isTypeSupported(v));if(!mime){document.getElementById('status').textContent='このブラウザは動画書き出しに対応していません。';busy=false;return}let rec=previewOnly?null:new MediaRecorder(stream,{mimeType:mime}),chunks=[];if(rec){rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.start()}document.getElementById('status').textContent=previewOnly?'▶ プレビュー中':'⏺ 動画を書き出し中…';for(const s of scenes){let start=performance.now(),ms=s.duration*1000;while(performance.now()-start<ms){draw(s,(performance.now()-start)/ms);await new Promise(r=>requestAnimationFrame(r))}}if(rec){rec.stop();await new Promise(r=>rec.onstop=r);const blob=new Blob(chunks,{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(document.getElementById('title').value||'my-video').replace(/[\\/:*?"<>|]/g,'_')+'.webm';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);document.getElementById('status').textContent='✅ 動画を保存しました！'}else document.getElementById('status').textContent='プレビュー終了';busy=false}document.getElementById('add').onclick=()=>{scenes.push({text:'新しいシーン',duration:3});save();render()};document.getElementById('play').onclick=()=>make(true);document.getElementById('export').onclick=()=>make(false);render();draw(scenes[0],1)</script></body></html>
