<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Mini Battle Royale</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#6aa95b;font-family:Arial;color:white;touch-action:none}canvas{width:100vw;height:100vh}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px;font-weight:bold}.box{background:#14202ddd;padding:8px 12px;border-radius:12px}.bar{height:9px;width:150px;background:#0008;border-radius:8px;margin-top:4px}.bar i{display:block;height:100%}.hp i{background:#45df76}.sh i{background:#48a9ff}.bottom{position:fixed;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end}.slots{display:flex;gap:7px}.slot{width:60px;height:60px;border:2px solid #fff6;border-radius:12px;background:#14202ddd;display:grid;place-items:center;font-size:25px}.sel{border-color:#ffe15b}.btn{border:0;border-radius:12px;padding:12px;background:#2674c9;color:white;font-weight:bold}.fire{width:85px;height:85px;border-radius:50%;background:#e95353}.screen{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:5}.card{background:#172431;padding:28px;border-radius:22px;text-align:center;width:min(92vw,460px)}.start{border:0;border-radius:14px;padding:15px 28px;background:#4fe07b;font-size:19px;font-weight:bold}.touch{display:none}.t{position:fixed;width:55px;height:55px;border-radius:50%;background:#111a;border:1px solid #fff4;display:grid;place-items:center}.up{left:60px;bottom:135px}.down{left:60px;bottom:20px}.le{left:5px;bottom:77px}.ri{left:115px;bottom:77px}.build{display:none;position:fixed;right:55px;bottom:135px;width:75px;height:48px;border:0;border-radius:12px;background:#3989df;color:white;font-weight:bold}@media(max-width:700px){.touch,.build{display:grid}.fire{display:block}.bottom .btn{display:none}.slot{width:50px;height:50px}.bar{width:105px}.top{font-size:11px}}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><div class="box">🏝️ MINI ROYALE</div><div><div class="box">❤️ <span id="h">100</span>　🛡️ <span id="s">50</span></div><div class="bar hp"><i id="hb"></i></div><div class="bar sh"><i id="sb"></i></div></div><div class="box">👥 <span id="n">9</span>　⏱ <span id="tm">120</span></div></div><div class="bottom"><div class="slots"><div class="slot sel">🔫</div><div class="slot">💥</div><div class="slot">🧱</div></div><button class="btn" onclick="mode='wall'">🧱 壁</button><button class="btn" onclick="mode='floor'">⬜ 床</button><button class="btn fire" id="fire">FIRE</button></div></div><div class="screen" id="menu"><div class="card"><h1>🏝️ MINI BATTLE ROYALE</h1><p>フォートナイト風のオリジナル2Dバトルロイヤル</p><p>🔫 射撃　🧱 建築　🌪️ ストーム　🎁 アイテム</p><button class="start" onclick="start()">バトル開始</button><p>PC：WASD＋マウス　/　スマホ：画面ボタン</p></div></div><div class="screen" id="res" style="display:none"><div class="card"><h1 id="title"></h1><p id="desc"></p><button class="start" onclick="location.reload()">もう一度</button></div></div><div class="touch"><div class="t up" data-k="w">▲</div><div class="t down" data-k="s">▼</div><div class="t le" data-k="a">◀</div><div class="t ri" data-k="d">▶</div></div><button class="build" id="build">🧱 BUILD</button><script>const c=document.getElementById('c'),x=c.getContext('2d');let W,H;function size(){W=c.width=innerWidth;H=c.height=innerHeight}size();onresize=size;const k={},m={x:0,y:0,down:false};onkeydown=e=>{k[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='q')mode=mode==='gun'?'wall':'gun'};onkeyup=e=>k[e.key.toLowerCase()]=0;c.onpointermove=e=>(m.x=e.clientX,m.y=e.clientY);c.onpointerdown=e=>(m.down=true,m.x=e.clientX,m.y=e.clientY);onpointerup=()=>m.down=false;document.querySelectorAll('.t').forEach(a=>{a.onpointerdown=e=>(e.preventDefault(),k[a.dataset.k]=1);a.onpointerup=a.onpointercancel=()=>k[a.dataset.k]=0});fire.onpointerdown=e=>(e.preventDefault(),m.down=true);fire.onpointerup=()=>m.down=false;build.onpointerdown=e=>(e.preventDefault(),makeWall());let p,b=[],shots=[],walls=[],items=[],playing=false,time=120,mode='gun',cool=0,storm=0;const R=(a,z)=>Math.random()*(z-a)+a,D=(a,z)=>Math.hypot(a.x-z.x,a.y-z.y);function start(){menu.style.display='none';playing=true;p={x:W/2,y:H/2,r:18,hp:100,sh:50,ammo:40,mat:60};b=[];shots=[];walls=[];items=[];for(let i=0;i<8;i++)b.push({x:R(50,W-50),y:R(100,H-50),r:17,hp:100,cd:R(.5,2),a:R(0,7),v:R(60,100)});for(let i=0;i<12;i++)items.push({x:R(40,W-40),y:R(100,H-40),t:Math.random()<.34?'ammo':Math.random()<.5?'heal':'shield'});ui()}function blocked(o){return o.x<o.r||o.x>W-o.r||o.y<85+o.r||o.y>H-o.r||walls.some(w=>o.x+o.r>w.x&&o.x-o.r<w.x+w&&o.y+o.r>w.y&&o.y-o.r<w.y+w2)}function move(o,dx,dy){let q={x:o.x+dx,y:o.y,r:o.r};if(!blocked(q))o.x=q.x;q={x:o.x,y:o.y+dy,r:o.r};if(!blocked(q))o.y=q.y}function shot(o,tx,ty,t){let a=Math.atan2(ty-o.y,tx-o.x);shots.push({x:o.x,y:o.y,vx:Math.cos(a)*650,vy:Math.sin(a)*650,t,life:1.1,d:t==='p'?24:9})}function makeWall(){if(p.mat<10)return;let dx=m.x-p.x,dy=m.y-p.y;if(mode==='floor'){walls.push({x:Math.round(p.x/40)*40-18,y:Math.round(p.y/40)*40-18,w:36,w2:36})}else{let xx=p.x+(Math.abs(dx)>Math.abs(dy)?(dx>0?35:-35):0),yy=p.y+(Math.abs(dy)>=Math.abs(dx)?(dy>0?35:-35):0);walls.push({x:xx-7,y:yy-25,w:14,w2:50})}p.mat-=10}function hurt(d){let q=Math.min(p.sh,d);p.sh-=q;p.hp-=d-q;if(p.hp<=0)end(false)}function end(win){playing=false;res.style.display='grid';title.textContent=win?'🏆 VICTORY ROYALE!':'💥 GAME OVER';desc.textContent=win?'最後まで生き残った！':'倒されてしまった！'}function ui(){h.textContent=Math.ceil(p.hp);s.textContent=Math.ceil(p.sh);hb.style.width=p.hp+'%';sb.style.width=p.sh+'%';n.textContent=b.filter(z=>z.hp>0).length+1;tm.textContent=Math.ceil(time)}function update(dt){if(!playing)return;time-=dt;cool=Math.max(0,cool-dt);storm+=dt;let dx=(k.d||k.arrowright)-(k.a||k.arrowleft),dy=(k.s||k.arrowdown)-(k.w||k.arrowup),q=Math.hypot(dx,dy)||1;move(p,dx/q*250*dt,dy/q*250*dt);if(m.down&&mode==='gun'&&cool<=0&&p.ammo>0){shot(p,m.x,m.y,'p');p.ammo--;cool=.16}for(let z of b){if(z.hp<=0)continue;let a=Math.atan2(p.y-z.y,p.x-z.x),d=D(p,z);z.cd-=dt;if(d<430){move(z,Math.cos(a)*z.v*dt,Math.sin(a)*z.v*dt);if(z.cd<=0){shot(z,p.x,p.y,'e');z.cd=R(1,2)}}else{z.a+=R(-.05,.05);move(z,Math.cos(z.a)*z.v*.4*dt,Math.sin(z.a)*z.v*.4*dt)}}for(let z of shots){z.x+=z.vx*dt;z.y+=z.vy*dt;z.life-=dt;if(z.x<0||z.x>W||z.y<80||z.y>H)z.life=0;if(z.t==='p')for(let e of b)if(e.hp>0&&D(z,e)<22){e.hp-=z.d;z.life=0;break}else if(z.t==='e'&&D(z,p)<22){hurt(z.d);z.life=0}}shots=shots.filter(z=>z.life>0);walls=walls.filter(z=>(z.life=(z.life||20)-dt)>0);items=items.filter(z=>{if(D(p,z)<28){if(z.t==='ammo')p.ammo=Math.min(60,p.ammo+15);if(z.t==='heal')p.hp=Math.min(100,p.hp+30);if(z.t==='shield')p.sh=Math.min(100,p.sh+30);return false}return true});let rad=Math.max(90,Math.min(W,H)*.48-Math.max(0,storm-20)*5);if(storm>20&&D(p,{x:W/2,y:H/2})>rad)hurt(6*dt);for(let z of b)if(z.hp>0&&D(z,{x:W/2,y:H/2})>rad)z.hp-=5*dt;if(b.every(z=>z.hp<=0)||time<=0)end(true);ui()}function draw(){x.fillStyle='#72ad60';x.fillRect(0,0,W,H);for(let i=0;i<W;i+=55)for(let j=85;j<H;j+=55){x.fillStyle=(i+j)%110?'#78b566':'#6eaa5d';x.fillRect(i,j,55,55)}for(let z of items){x.fillStyle=z.t==='ammo'?'#ffd34d':z.t==='heal'?'#43df78':'#55aaff';x.fillRect(z.x-9,z.y-9,18,18)}for(let w of walls){x.fillStyle='#b78a57';x.fillRect(w.x,w.y,w.w,w.w2);x.strokeStyle='#f1c58b';x.strokeRect(w.x,w.y,w.w,w.w2)}for(let z of shots){x.fillStyle=z.t==='p'?'#fff070':'#ff6875';x.beginPath();x.arc(z.x,z.y,5,0,7);x.fill()}for(let z of b)if(z.hp>0)unit(z,'#e85b60');unit(p,'#36aef0');if(storm>20){let r=Math.max(90,Math.min(W,H)*.48-(storm-20)*5);x.fillStyle='#8c59c866';x.beginPath();x.rect(0,85,W,H-85);x.arc(W/2,H/2,r,0,7,true);x.fill('evenodd');x.strokeStyle='#c18cff';x.lineWidth=5;x.beginPath();x.arc(W/2,H/2,r,0,7);x.stroke()}}function unit(o,col){x.fillStyle=col;x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill();x.strokeStyle='white';x.stroke();x.fillStyle='#0009';x.fillRect(o.x-20,o.y-29,40,5);x.fillStyle='#45df76';x.fillRect(o.x-20,o.y-29,40*Math.max(0,o.hp/100),5)}function loop(t){let dt=Math.min(.033,(t-(loop.last||t))/1000);loop.last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
