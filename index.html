<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mini Battle Royale 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#6bad55;font-family:Arial,sans-serif;color:#fff;touch-action:none}#game{position:fixed;inset:0}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;gap:8px;padding:10px}.box{background:#101820dd;border-radius:12px;padding:8px 12px;text-shadow:0 2px 2px #000}.bars{width:190px}.bar{height:10px;background:#0008;border-radius:8px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}.hp i{background:#42df70}.sh i{background:#48a8ff}.bottom{position:fixed;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;align-items:end;gap:8px}.weapons{display:flex;gap:7px}.slot{width:78px;height:67px;background:#101820dd;border:2px solid #ffffff44;border-radius:12px;text-align:center;padding:5px;font-size:11px}.slot.sel{border-color:#ffe05b;box-shadow:0 0 14px #ffe05b77}.slot b{display:block;font-size:21px}.build{display:flex;gap:5px}.build button,.mobileFire{border:0;border-radius:11px;padding:11px;background:#8b5b35;color:#fff;font-weight:bold}.screen{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:10}.card{background:#172431f5;border-radius:22px;padding:28px;text-align:center;width:min(92vw,520px);box-shadow:0 12px 50px #0008}.start{border:0;border-radius:14px;padding:15px 28px;background:#4fe07b;font-size:19px;font-weight:bold}.cross{position:fixed;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%);z-index:3;pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:white}.cross:before{width:24px;height:2px;top:11px}.cross:after{width:2px;height:24px;left:11px}.info{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);font-weight:bold;text-shadow:0 2px 3px #000;white-space:nowrap}.hit{position:fixed;left:50%;top:53%;transform:translate(-50%,-50%);font-weight:900;font-size:18px;color:#ffe15b;text-shadow:0 2px 3px #000;opacity:0;transition:.08s}.hit.show{opacity:1}.mobileFire{display:none;position:fixed;right:18px;bottom:170px;width:82px;height:82px;border-radius:50%;background:#e74f4f;font-size:16px;z-index:4}@media(max-width:700px){.top{font-size:10px}.bars{width:110px}.slot{width:58px;height:57px;font-size:9px}.slot b{font-size:18px}.build button{padding:9px 7px;font-size:10px}.info{bottom:145px;font-size:10px}.mobileFire{display:block}}
</style>
</head>
<body>
<div id="game"></div><div class="cross"></div><div class="hit" id="hit">HIT!</div>
<div class="hud"><div class="top"><div class="box">🌎 3D MINI ROYALE<br><small>WASD 移動 / マウス 視点</small></div><div class="bars"><div class="box">❤️ <span id="hp">100</span>　🛡️ <span id="shield">50</span></div><div class="bar hp"><i id="hpbar" style="width:100%"></i></div><div class="bar sh"><i id="shbar" style="width:50%"></i></div></div><div class="box">👥 <span id="alive">13</span>　⏱ <span id="time">180</span><br>💀 <span id="kills">0</span> KILLS</div></div><div class="info" id="info">左クリック：射撃　R：リロード　1/2/3：武器　Q：建築</div><div class="bottom"><div class="weapons"><div class="slot sel" id="w1"><b>🔫</b>AR<br><span id="a1">30</span>/120</div><div class="slot" id="w2"><b>💥</b>SHOTGUN<br><span id="a2">6</span>/36</div><div class="slot" id="w3"><b>🎯</b>SMG<br><span id="a3">40</span>/160</div></div><div class="build"><button id="wallBtn">🧱 WALL</button><button id="floorBtn">⬜ FLOOR</button><button id="rampBtn">📐 RAMP</button></div></div><button class="mobileFire" id="fire">FIRE</button></div>
<div class="screen" id="menu"><div class="card"><h1>🌎 MINI BATTLE ROYALE 3D</h1><p>敵を狙って撃破し、最後まで生き残れ！</p><p>🔫 AR　💥 ショットガン　🎯 SMG<br>🧱 壁　⬜ 床　📐 ランプ</p><button class="start" id="start">バトル開始</button><p>PC：WASD＋マウス＋左クリック<br>スマホ：FIREボタン</p></div></div>
<div class="screen" id="result" style="display:none"><div class="card"><h1 id="resultTitle"></h1><p id="resultDesc"></p><button class="start" onclick="location.reload()">もう一度</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
const hpEl=$('hp'),shieldEl=$('shield'),hpbarEl=$('hpbar'),shbarEl=$('shbar'),aliveEl=$('alive'),timeEl=$('time'),killsEl=$('kills'),a1El=$('a1'),a2El=$('a2'),a3El=$('a3');
const menuEl=$('menu'),resultEl=$('result'),startBtn=$('start'),fireBtn=$('fire'),wallBtn=$('wallBtn'),floorBtn=$('floorBtn'),rampBtn=$('rampBtn'),w1El=$('w1'),w2El=$('w2'),w3El=$('w3');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x82c968);scene.fog=new THREE.Fog(0x82c968,80,280);const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbfe9ff,0x466b3c,2));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(80,130,50);sun.castShadow=true;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(360,360),new THREE.MeshStandardMaterial({color:0x68ad54}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(360,72,0x4d8c43,0x5a984b);grid.position.y=.02;scene.add(grid);
const enemies=[],bullets=[],builds=[],keys={};let playing=false,last=performance.now(),gameTime=180,stormR=155,weapon=0,cool=0,reload=0,kills=0,fireHeld=false,stormMesh=null;
const guns=[{name:'AR',damage:25,rate:.12,mag:30,reserve:120,pellets:1,spread:.018},{name:'SHOTGUN',damage:15,rate:.72,mag:6,reserve:36,pellets:8,spread:.12},{name:'SMG',damage:12,rate:.075,mag:40,reserve:160,pellets:1,spread:.055}],ammo=[30,6,40],reserve=[120,36,160];
const player={pos:new THREE.Vector3(0,1.7,0),hp:100,shield:50,yaw:0,pitch:0,speed:18};
function material(c){return new THREE.MeshStandardMaterial({color:c})}function cube(sx,sy,sz,color){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material(color));m.castShadow=true;m.receiveShadow=true;return m}
function world(){for(let i=0;i<48;i++){let x=(Math.random()-.5)*310,z=(Math.random()-.5)*310;if(Math.hypot(x,z)<35)continue;let sx=5+Math.random()*11,sz=5+Math.random()*11,sy=2+Math.random()*9,o=cube(sx,sy,sz,Math.random()<.5?0x806148:0x9b8a64);o.position.set(x,sy/2,z);scene.add(o)}for(let i=0;i<24;i++){let x=(Math.random()-.5)*310,z=(Math.random()-.5)*310,t=new THREE.Mesh(new THREE.CylinderGeometry(1.5,2,8,10),material(0x347d38));t.position.set(x,4,z);t.castShadow=true;scene.add(t)}}world();
function enemyBody(e){const g=new THREE.Group(),body=cube(1.35,2,1.35,0xe34f59);body.position.y=1;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.52,12,8),material(0xf0c7a6));head.position.y=2.25;head.castShadow=true;g.add(head);const barBg=cube(1.5,.12,.08,0x202020);barBg.position.set(0,3,0);g.add(barBg);const bar=cube(1.45,.1,.1,0x43e36d);bar.position.set(0,3,.06);g.add(bar);e.hpBar=bar;return g}
function spawn(){for(let i=0;i<12;i++){let a=Math.random()*Math.PI*2,r=55+Math.random()*100,e={pos:new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r),hp:100,cd:1+Math.random()*2,speed:5+Math.random()*4,mesh:null,hpBar:null,dead:false};e.mesh=enemyBody(e);e.mesh.position.copy(e.pos);scene.add(e.mesh);enemies.push(e)}}
function clear(){for(const e of enemies)scene.remove(e.mesh);enemies.length=0;for(const b of bullets)scene.remove(b);bullets.length=0;for(const o of builds)scene.remove(o);builds.length=0}
function setWeapon(i){weapon=i;document.querySelectorAll('.slot').forEach((s,j)=>s.classList.toggle('sel',i===j));show('武器：'+guns[i].name)}
function flash(text){const h=$('hit');h.textContent=text;h.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>h.classList.remove('show'),180)}
function show(t){$('info').textContent=t;clearTimeout(show.t);show.t=setTimeout(()=>$('info').textContent='左クリック：射撃　R：リロード　1/2/3：武器　Q：建築',900)}
function shoot(){if(!playing||reload>0||cool>0)return;const g=guns[weapon];if(ammo[weapon]<=0){reload=.85;show('リロード中…');return}ammo[weapon]--;cool=g.rate;const forward=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(player.pitch,player.yaw,0,'YXZ'));for(let i=0;i<g.pellets;i++){let dir=forward.clone();dir.x+=(Math.random()-.5)*g.spread;dir.y+=(Math.random()-.5)*g.spread;dir.z+=(Math.random()-.5)*g.spread;dir.normalize();const b=new THREE.Mesh(new THREE.SphereGeometry(.09,6,6),material(0xffed66));b.position.copy(player.pos);b.userData={dir,life:2.4,damage:g.damage,owner:'player'};scene.add(b);bullets.push(b)}}
function enemyShoot(e){const origin=e.pos.clone().add(new THREE.Vector3(0,1.25,0)),dir=player.pos.clone().sub(origin).normalize(),b=new THREE.Mesh(new THREE.SphereGeometry(.1,6,6),material(0xff5662));b.position.copy(origin);b.userData={dir,life:3,damage:7,owner:'enemy'};scene.add(b);bullets.push(b)}
function hitEnemy(e,d){if(e.dead)return;e.hp-=d;flash('HIT - '+d);e.hpBar.scale.x=Math.max(0,e.hp/100);if(e.hp<=0){e.dead=true;kills++;e.mesh.visible=false;flash('💀 ELIMINATED!')}}
function hurt(d){let s=Math.min(player.shield,d);player.shield-=s;player.hp-=d-s;if(player.hp<=0)end(false)}
function end(win){if(!playing)return;playing=false;document.exitPointerLock?.();resultEl.style.display='grid';$('resultTitle').textContent=win?'🏆 VICTORY ROYALE!':'💥 GAME OVER';$('resultDesc').textContent=win?'敵を全員撃破！ KILLS: '+kills:'KILLS: '+kills}
function build(type){if(!playing)return;const dir=new THREE.Vector3(Math.sin(player.yaw),0,Math.cos(player.yaw)),p=player.pos.clone().add(dir.multiplyScalar(5)),x=Math.round(p.x/5)*5,z=Math.round(p.z/5)*5;let o;if(type==='wall'){o=cube(5,5,.35,0xb87945);o.position.set(x,2.5,z);o.rotation.y=player.yaw}else if(type==='floor'){o=cube(5,.25,5,0xb87945);o.position.set(x,.12,z)}else{o=cube(5,3,5,0xb87945);o.position.set(x,1.5,z);o.rotation.x=-.55}o.userData.life=40;scene.add(o);builds.push(o)}
function update(dt){if(!playing)return;gameTime-=dt;cool=Math.max(0,cool-dt);if(reload>0){reload-=dt;if(reload<=0){const g=guns[weapon],need=g.mag-ammo[weapon],take=Math.min(need,reserve[weapon]);ammo[weapon]+=take;reserve[weapon]-=take;flash('RELOADED')}}let f=(keys.KeyW?1:0)-(keys.KeyS?1:0),r=(keys.KeyD?1:0)-(keys.KeyA?1:0),move=new THREE.Vector3(r,0,-f);if(move.lengthSq())move.normalize().multiplyScalar(player.speed*dt).applyAxisAngle(new THREE.Vector3(0,1,0),player.yaw);player.pos.add(move);player.pos.x=THREE.MathUtils.clamp(player.pos.x,-175,175);player.pos.z=THREE.MathUtils.clamp(player.pos.z,-175,175);if(fireHeld)shoot();camera.position.copy(player.pos);camera.rotation.set(player.pitch,player.yaw,0,'YXZ');for(const e of enemies){if(e.dead)continue;const to=player.pos.clone().sub(e.pos);to.y=0;const d=to.length();if(d>24){to.normalize();e.pos.addScaledVector(to,e.speed*dt)}else{e.cd-=dt;if(e.cd<=0){enemyShoot(e);e.cd=1.1+Math.random()*1.3}}e.mesh.position.set(e.pos.x,0,e.pos.z);e.mesh.lookAt(player.pos.x,1,player.pos.z)}for(const b of bullets){const old=b.position.clone();b.position.addScaledVector(b.userData.dir,48*dt);b.userData.life-=dt;if(b.userData.owner==='player'){for(const e of enemies){if(e.dead)continue;const target=e.pos.clone().add(new THREE.Vector3(0,1.15,0)),seg=new THREE.Line3(old,b.position),closest=new THREE.Vector3();seg.closestPointToPoint(target,true,closest);if(closest.distanceTo(target)<1.5){hitEnemy(e,b.userData.damage);b.userData.life=0;break}}}else if(b.position.distanceTo(player.pos)<1.25){hurt(b.userData.damage);b.userData.life=0}if(Math.abs(b.position.x)>180||Math.abs(b.position.z)>180)b.userData.life=0}for(let i=bullets.length-1;i>=0;i--)if(bullets[i].userData.life<=0){scene.remove(bullets[i]);bullets.splice(i,1)}for(let i=builds.length-1;i>=0;i--){builds[i].userData.life-=dt;if(builds[i].userData.life<=0){scene.remove(builds[i]);builds.splice(i,1)}}stormR=Math.max(35,155-Math.max(0,180-gameTime)*.72);if(Math.hypot(player.pos.x,player.pos.z)>stormR)hurt(5*dt);for(const e of enemies)if(!e.dead&&Math.hypot(e.pos.x,e.pos.z)>stormR){e.hp-=8*dt;if(e.hp<=0){e.dead=true;e.mesh.visible=false}}if(enemies.length>0&&enemies.every(e=>e.dead)){end(true);return}if(gameTime<=0){end(false);return}ui()}
function ui(){hpEl.textContent=Math.max(0,Math.ceil(player.hp));shieldEl.textContent=Math.max(0,Math.ceil(player.shield));hpbarEl.style.width=Math.max(0,player.hp)+'%';shbarEl.style.width=Math.max(0,player.shield)+'%';aliveEl.textContent=enemies.filter(e=>!e.dead).length+1;timeEl.textContent=Math.max(0,Math.ceil(gameTime));killsEl.textContent=kills;a1El.textContent=ammo[0];a2El.textContent=ammo[1];a3El.textContent=ammo[2]}
function storm(){if(!stormMesh){stormMesh=new THREE.Mesh(new THREE.RingGeometry(.8,1,96),new THREE.MeshBasicMaterial({color:0xb87cff,side:THREE.DoubleSide,transparent:true,opacity:.72}));stormMesh.rotation.x=-Math.PI/2;stormMesh.position.y=.04;scene.add(stormMesh)}stormMesh.scale.set(stormR,stormR,1)}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);storm();renderer.render(scene,camera)}
renderer.domElement.addEventListener('click',()=>{if(playing&&!document.pointerLockElement)document.body.requestPointerLock?.()});document.addEventListener('mousemove',e=>{if(document.pointerLockElement&&playing){player.yaw-=e.movementX*.0022;player.pitch-=e.movementY*.0022;player.pitch=THREE.MathUtils.clamp(player.pitch,-1.35,1.35)}});document.addEventListener('mousedown',e=>{if(e.button===0)fireHeld=true});document.addEventListener('mouseup',()=>fireHeld=false);document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Digit1')setWeapon(0);if(e.code==='Digit2')setWeapon(1);if(e.code==='Digit3')setWeapon(2);if(e.code==='KeyR'&&ammo[weapon]<guns[weapon].mag)reload=.85;if(e.code==='KeyQ')show('建築：下のボタンを押して設置')});document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('contextmenu',e=>e.preventDefault());wallBtn.onclick=()=>build('wall');floorBtn.onclick=()=>build('floor');rampBtn.onclick=()=>build('ramp');w1El.onclick=()=>setWeapon(0);w2El.onclick=()=>setWeapon(1);w3El.onclick=()=>setWeapon(2);fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();fireHeld=true;shoot()});fireBtn.addEventListener('pointerup',e=>{e.preventDefault();fireHeld=false});fireBtn.addEventListener('pointercancel',()=>fireHeld=false);startBtn.onclick=()=>{menuEl.style.display='none';clear();spawn();playing=true;gameTime=180;player.hp=100;player.shield=50;kills=0;last=performance.now()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop(performance.now());
</script></body></html>
