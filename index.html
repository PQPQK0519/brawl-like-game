<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Mini Brawler</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18251b;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:10px;font-weight:900}.pill{background:#101722dd;padding:8px 12px;border-radius:12px}.bar{width:150px;height:9px;background:#0008;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#45df76}.ammo{position:fixed;left:14px;bottom:18px;display:flex;gap:5px}.ammo b{width:13px;height:25px;background:#ffe06b;border-radius:4px}.ammo b.off{opacity:.2}.super{position:fixed;left:14px;bottom:52px;width:230px;height:14px;background:#0008;border-radius:10px;overflow:hidden}.super i{display:block;height:100%;width:0;background:#a064ff}.screen{position:fixed;inset:0;display:grid;place-items:center;background:#000b;z-index:4}.card{background:#18212d;border-radius:22px;padding:28px;text-align:center;width:min(90vw,440px)}button{border:0;border-radius:14px;padding:14px 22px;font-weight:900;font-size:18px;background:#51df7c}.touch{display:none}.t{position:fixed;width:58px;height:58px;border-radius:50%;background:#111a;border:1px solid #fff3;display:grid;place-items:center}.up{left:62px;bottom:135px}.down{left:62px;bottom:20px}.left{left:7px;bottom:77px}.right{left:117px;bottom:77px}.attack{display:none;position:fixed;right:18px;bottom:22px;width:96px;height:96px;border-radius:50%;background:#e84e5c;place-items:center;font-weight:900}.heal{display:none;position:fixed;right:48px;bottom:135px;width:82px;height:48px;border-radius:14px;background:#48d879;place-items:center;font-weight:900}@media(max-width:700px){.touch,.attack,.heal{display:grid}.top{font-size:11px}.bar{width:110px}}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><div class="pill">⚡ MINI BRAWLER</div><div class="pill"><span id="hp">HP 100/100</span><div class="bar"><i id="hpbar"></i></div></div><div class="pill">⏱ <span id="tm">90</span></div></div><div class="ammo" id="ammo"></div><div class="super"><i id="sp"></i></div></div><div class="screen" id="menu"><div class="card"><h1>MINI BRAWLER</h1><p>敵を全部倒そう！</p><p>❤️ 回復ボタンでHPを回復できます</p><button onclick="start()">ゲーム開始</button><p>PC：WASD＋マウス<br>スマホ：画面ボタン</p></div></div><div class="screen" id="result" style="display:none"><div class="card"><h1 id="rt"></h1><p id="rd"></p><button onclick="location.reload()">もう一度</button></div></div><div class="touch"><div class="t up" data-k="w">▲</div><div class="t down" data-k="s">▼</div><div class="t left" data-k="a">◀</div><div class="t right" data-k="d">▶</div></div><div class="attack" id="atk">ATTACK</div><div class="heal" id="heal">❤️ 回復</div><script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;function size(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',size);size();const k={},mouse={x:0,y:0,down:false};addEventListener('keydown',e=>k[e.key.toLowerCase()]=1);addEventListener('keyup',e=>k[e.key.toLowerCase()]=0);c.onpointermove=e=>(mouse.x=e.clientX,mouse.y=e.clientY);c.onpointerdown=e=>(mouse.down=true,mouse.x=e.clientX,mouse.y=e.clientY);addEventListener('pointerup',()=>mouse.down=false);
let p,enemies,bullets=[],walls=[],playing=false,time=90,last=0;function start(){playing=true;menu.style.display='none';p={x:W*.18,y:H*.5,r:20,hp:100,max:100,ammo:3,cd:0,reload:0,super:0,healCd:0};enemies=[];bullets=[];walls=[{x:W*.4,y:H*.18,w:W*.12,h:H*.2},{x:W*.58,y:H*.58,w:W*.12,h:H*.2}];for(let i=0;i<3;i++)enemies.push({x:W*(.67+i*.08),y:H*(.28+i*.2),r:20,hp:100,cd:.5+i*.3});time=90}
function blocked(q,r=3){return q.x<r||q.x>W-r||q.y<80+r||q.y>H-r||walls.some(o=>q.x+r>o.x&&q.x-r<o.x+o.w&&q.y+r>o.y&&q.y-r<o.y+o.h)}function mv(o,dx,dy){let a={x:o.x+dx,y:o.y};if(!blocked(a,o.r))o.x=a.x;a={x:o.x,y:o.y+dy};if(!blocked(a,o.r))o.y=a.y}function fire(o,tx,ty,team,dmg){let a=Math.atan2(ty-o.y,tx-o.x);bullets.push({x:o.x,y:o.y,vx:Math.cos(a)*560,vy:Math.sin(a)*560,team,dmg,life:1.4})}
function shoot(){if(p.cd<=0&&p.ammo>0){fire(p,mouse.x,mouse.y,'p',25);p.ammo--;p.cd=.25;p.reload=0;ui()}}function heal(){if(p.healCd<=0&&p.hp<p.max){p.hp=Math.min(p.max,p.hp+35);p.healCd=5;ui()}}atk.onpointerdown=e=>{e.preventDefault();shoot()};heal.onpointerdown=e=>{e.preventDefault();heal()};document.querySelectorAll('.t').forEach(z=>{z.onpointerdown=e=>{e.preventDefault();k[z.dataset.k]=1};z.onpointerup=z.onpointercancel=()=>k[z.dataset.k]=0});
function end(win){playing=false;result.style.display='grid';rt.textContent=win?'🏆 勝利！':'💥 敗北…';rd.textContent=win?'敵を全員倒した！':'HPが0になった！'}function ui(){hp.textContent=`HP ${Math.ceil(p.hp)}/${p.max}`;hpbar.style.width=(p.hp/p.max*100)+'%';sp.style.width=p.super+'%';ammo.innerHTML=[0,1,2].map(i=>`<b class="${i<p.ammo?'':'off'}"></b>`).join('')}
function update(dt){if(!playing)return;time-=dt;p.cd=Math.max(0,p.cd-dt);p.healCd=Math.max(0,p.healCd-dt);p.reload+=dt;if(p.reload>.8&&p.ammo<3){p.ammo++;p.reload=0}let dx=(k.d||k.arrowright)-(k.a||k.arrowleft),dy=(k.s||k.arrowdown)-(k.w||k.arrowup),m=Math.hypot(dx,dy)||1;mv(p,dx/m*250*dt,dy/m*250*dt);if(mouse.down)shoot();for(let e of enemies){if(e.hp<=0)continue;let a=Math.atan2(p.y-e.y,p.x-e.x),d=Math.hypot(p.x-e.x,p.y-e.y);if(d>240)mv(e,Math.cos(a)*90*dt,Math.sin(a)*90*dt);if(d<500){e.cd-=dt;if(e.cd<=0){fire(e,p.x,p.y,'e',12);e.cd=1}}}for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(blocked(b))b.life=0;if(b.life<=0)continue;if(b.team==='p'){for(let e of enemies)if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<25){e.hp-=b.dmg;b.life=0;p.super=Math.min(100,p.super+15);break}}else if(Math.hypot(b.x-p.x,b.y-p.y)<25){p.hp-=b.dmg;b.life=0;if(p.hp<=0){p.hp=0;end(false)}}}bullets=bullets.filter(b=>b.life>0);if(enemies.every(e=>e.hp<=0))end(true);if(time<=0)end(false);ui();tm.textContent=Math.ceil(time)}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#21472a';x.fillRect(0,0,W,H);for(let i=0;i<W;i+=50)for(let j=80;j<H;j+=50){x.fillStyle=(i/50+j/50)%2?'#244b2b':'#22462a';x.fillRect(i,j,50,50)}for(let w of walls){x.fillStyle='#727a75';x.fillRect(w.x,w.y,w.w,w.h);x.strokeStyle='#c0c5c2';x.strokeRect(w.x,w.y,w.w,w.h)}for(let b of bullets){x.fillStyle=b.team==='p'?'#80edff':'#ff8790';x.beginPath();x.arc(b.x,b.y,6,0,7);x.fill()}unit(p,'#36c4f5');for(let e of enemies)if(e.hp>0)unit(e,'#f05761')}function unit(o,col){x.fillStyle=col;x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill();x.strokeStyle='#fff';x.stroke();x.fillStyle='#0008';x.fillRect(o.x-22,o.y-30,44,6);x.fillStyle='#45df76';x.fillRect(o.x-22,o.y-30,44*Math.max(0,o.hp/o.max),6)}function loop(t){let dt=Math.min(.033,(t-(last||t))/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);ui();
</script></body></html>
