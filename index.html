<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mini Brawler</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131b;color:#fff;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh;background:#19321c}#ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px;font-weight:800;text-shadow:0 2px 4px #000}.badge{background:#0009;border:1px solid #fff2;padding:8px 11px;border-radius:13px}#start,#over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0009;z-index:3}.panel{background:#17202b;border:1px solid #fff2;border-radius:22px;padding:30px;text-align:center;width:min(90vw,440px);box-shadow:0 20px 70px #000}.panel h1{font-size:44px;margin:0 0 10px}.panel button{border:0;border-radius:14px;padding:13px 22px;font-size:18px;font-weight:900;background:#4ee27b;color:#07130a}#touch{display:none}.t{position:fixed;width:55px;height:55px;border:1px solid #fff3;background:#111a;border-radius:50%;color:white;display:grid;place-items:center;font-size:22px;user-select:none}.up{left:64px;bottom:132px}.down{left:64px;bottom:20px}.left{left:8px;bottom:76px}.right{left:120px;bottom:76px}#attack{position:fixed;right:22px;bottom:28px;width:94px;height:94px;border-radius:50%;display:none;place-items:center;background:#ed5b63;color:white;font-weight:900}#super{position:fixed;right:34px;bottom:138px;display:none;border:0;border-radius:13px;background:#8c59f3;color:#fff;font-weight:900;padding:10px 14px}@media(max-width:700px){#touch,#attack,#super{display:grid}.top{font-size:12px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"><div class="top"><div class="badge">⚔ MINI BRAWLER</div><div class="badge" id="stats">HP 100　弾 3/3</div><div class="badge" id="clock">60</div></div></div>
<div id="start"><div class="panel"><h1>MINI BRAWLER</h1><p>オリジナル3v3風のトップダウンアクション</p><p>PC：WASD / 矢印で移動、マウスで狙ってクリック攻撃</p><p>スマホ：画面ボタンで操作</p><button id="go">ゲーム開始</button></div></div>
<div id="over" style="display:none"><div class="panel"><div id="icon" style="font-size:52px">🏆</div><h1 id="title">勝利！</h1><p id="desc"></p><button onclick="location.reload()">もう一度</button></div></div>
<div id="touch"><div class="t up" data-k="w">▲</div><div class="t down" data-k="s">▼</div><div class="t left" data-k="a">◀</div><div class="t right" data-k="d">▶</div></div>
<div id="attack">ATTACK</div><button id="super">SUPER</button>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W=innerWidth,H=innerHeight;function fit(){W=c.width=innerWidth;H=c.height=innerHeight}addEventListener('resize',fit);fit();
const keys={},mouse={x:W/2,y:H/2,down:false};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});c.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});c.addEventListener('pointerdown',e=>{mouse.down=true;mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('pointerup',()=>mouse.down=false);
const p={x:0,y:0,r:20,hp:100,ammo:3,reload:0,cd:0,super:0,speed:260,kills:0};let foes=[],bullets=[],walls=[],running=false,over=false,time=60;
function reset(){p.x=W*.18;p.y=H*.5;foes=[];bullets=[];const n=Math.min(3,Math.max(2,Math.floor(W/420)));for(let i=0;i<n;i++)foes.push({x:W*(.68+i*.07),y:H*(.32+i*.18),r:20,hp:100,cd:.4+i*.3,speed:82});let ww=Math.min(150,W*.14),hh=Math.min(180,H*.27);walls=[{x:W*.38,y:H*.18,w:ww,h:hh},{x:W*.62-ww,y:H*.55,w:ww,h:hh}]}function collide(q,r){return q.x<r||q.x>W-r||q.y<r||q.y>H-r||walls.some(o=>q.x+r>o.x&&q.x-r<o.x+o.w&&q.y+r>o.y&&q.y-r<o.y+o.h)}function move(e,dx,dy){let nx=e.x+dx,ny=e.y+dy;if(!collide({x:nx,y:e.y},e.r))e.x=nx;if(!collide({x:e.x,y:ny},e.r))e.y=ny}
function fire(o,tx,ty,team,dmg){let a=Math.atan2(ty-o.y,tx-o.x);bullets.push({x:o.x,y:o.y,vx:Math.cos(a)*540,vy:Math.sin(a)*540,team,dmg,life:1.4})}function playerFire(){if(p.cd<=0&&p.ammo>0&&p.hp>0){fire(p,mouse.x,mouse.y,'p',25);p.ammo--;p.cd=.2;p.reload=0}}function end(win){if(over)return;over=true;document.getElementById('over').style.display='flex';document.getElementById('icon').textContent=win?'🏆':'💥';document.getElementById('title').textContent=win?'勝利！':'敗北…';document.getElementById('desc').textContent=win?'敵をすべて倒しました。':'HPが0になりました。'}
function update(dt){if(!running||over)return;time-=dt;if(time<=0){time=0;end(foes.filter(e=>e.hp>0).length===0);return}p.cd=Math.max(0,p.cd-dt);p.reload+=dt;if(p.reload>.65&&p.ammo<3){p.ammo++;p.reload=0}let dx=0,dy=0;if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;let m=Math.hypot(dx,dy)||1;move(p,dx/m*p.speed*dt,dy/m*p.speed*dt);if(mouse.down)playerFire();for(const e of foes){if(e.hp<=0)continue;const a=Math.atan2(p.y-e.y,p.x-e.x),d=Math.hypot(p.x-e.x,p.y-e.y);if(d>265)move(e,Math.cos(a)*e.speed*dt,Math.sin(a)*e.speed*dt);else if(d<125)move(e,-Math.cos(a)*e.speed*dt,-Math.sin(a)*e.speed*dt);e.cd-=dt;if(d<480&&e.cd<=0){fire(e,p.x,p.y,'e',14);e.cd=.8+Math.random()*.6}}for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(collide(b,4))b.life=0;if(b.team==='p'){for(const e of foes)if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<25){e.hp-=b.dmg;b.life=0;p.super=Math.min(100,p.super+12);if(e.hp<=0)p.kills++;break}}else if(p.hp>0&&Math.hypot(b.x-p.x,b.y-p.y)<25){p.hp-=b.dmg;b.life=0;if(p.hp<=0){p.hp=0;end(false)}}}bullets=bullets.filter(b=>b.life>0);if(foes.every(e=>e.hp<=0))end(true);document.getElementById('stats').textContent=`HP ${Math.ceil(p.hp)}　弾 ${p.ammo}/3　SUPER ${Math.floor(p.super)}%`;document.getElementById('clock').textContent=Math.ceil(time)}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#1e3820';x.fillRect(0,0,W,H);for(let i=0;i<W;i+=48)for(let j=0;j<H;j+=48){x.fillStyle=((i+j)/48%2?'#213d23':'#1f3921');x.fillRect(i,j,48,48)}for(const w of walls){x.fillStyle='#78827f';x.fillRect(w.x,w.y,w.w,w.h);x.strokeStyle='#b3bbb8';x.strokeRect(w.x+.5,w.y+.5,w.w-1,w.h-1)}for(let i=0;i<10;i++){x.fillStyle='#2d6435';x.beginPath();x.arc((i*127)%W,(i*83)%H,15,0,7);x.fill()}for(const b of bullets){x.fillStyle=b.team==='p'?'#8befff':'#ff9aa2';x.beginPath();x.arc(b.x,b.y,6,0,7);x.fill()}char(p,'#36baf2');for(const e of foes)if(e.hp>0)char(e,'#f15861');x.fillStyle='#000a';x.fillRect(18,H-38,220,22);x.fillStyle='#925af3';x.fillRect(18,H-38,220*p.super/100,22);x.fillStyle='#fff';x.font='bold 12px Arial';x.fillText(p.super>=100?'SUPER READY':'SUPER',28,H-23)}function char(e,col){x.fillStyle=col;x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke();x.fillStyle='#0009';x.fillRect(e.x-23,e.y-31,46,6);x.fillStyle=e===p?'#3fe477':'#ff5360';x.fillRect(e.x-23,e.y-31,46*Math.max(0,e.hp/100),6);if(e===p){x.fillStyle='#fff';x.textAlign='center';x.fillText('YOU',e.x,e.y+4);x.textAlign='left')}}
function loop(t){let dt=Math.min(.033,(t-(loop.last||t))/1000);loop.last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('go').onclick=()=>{running=true;document.getElementById('start').style.display='none';reset()};document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();playerFire()});document.getElementById('super').addEventListener('pointerdown',e=>{e.preventDefault();if(p.super>=100){fire(p,mouse.x,mouse.y,'p',55);p.super=0}});document.querySelectorAll('.t').forEach(el=>{let k=el.dataset.k;el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>keys[k]=false))});
</script></body></html>
