<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mini Battle Royale 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#75b85c;font-family:Arial,sans-serif;color:#fff;touch-action:none}#game{position:fixed;inset:0}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px;gap:8px}.box{background:#101a25dd;padding:8px 12px;border-radius:12px;text-shadow:0 1px 2px #000}.bars{width:180px}.bar{height:10px;background:#0008;border-radius:8px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}.hp i{background:#45df76}.sh i{background:#45a9ff}.bottom{position:fixed;left:12px;right:12px;bottom:12px;display:flex;align-items:end;justify-content:space-between}.weapons{display:flex;gap:8px}.slot{width:76px;height:68px;background:#101a25dd;border:2px solid #fff5;border-radius:12px;text-align:center;padding:5px}.slot.sel{border-color:#ffe15b;box-shadow:0 0 12px #ffe15b66}.slot b{display:block;font-size:22px}.build{display:flex;gap:6px}.build button{pointer-events:auto;border:0;border-radius:10px;padding:11px;background:#8d613b;color:#fff;font-weight:bold}.screen{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:5}.card{background:#172431ee;padding:30px;border-radius:22px;text-align:center;width:min(92vw,500px)}.start{border:0;border-radius:14px;padding:15px 28px;background:#4fe07b;font-size:19px;font-weight:bold;cursor:pointer}.cross{position:fixed;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:"";position:absolute;background:#fff}.cross:before{width:22px;height:2px;top:10px}.cross:after{height:22px;width:2px;left:10px}.info{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);font-weight:bold;text-shadow:0 2px 3px #000}.hit{position:fixed;left:50%;top:54%;transform:translate(-50%,-50%);font-size:22px;font-weight:bold;text-shadow:0 2px 3px #000;opacity:0;transition:.12s}.hit.show{opacity:1}.mobileFire{display:none}@media(max-width:700px){.top{font-size:11px}.bars{width:105px}.slot{width:58px;height:55px;font-size:10px}.slot b{font-size:18px}.info{bottom:150px;font-size:12px}.mobileFire{display:block;position:fixed;right:18px;bottom:175px;width:82px;height:82px;border-radius:50%;background:#e95353;border:0;color:#fff;font-weight:bold;font-size:16px}}
</style>
</head>
<body>
<div id="game"></div><div class="cross"></div><div class="hit" id="hit">HIT!</div>
<div class="hud"><div class="top"><div class="box">🌎 3D MINI ROYALE<br><small>WASD 移動 / マウス 視点</small></div><div class="bars"><div class="box">❤️ <span id="hp">100</span>　🛡️ <span id="shield">50</span>　💀 <span id="kills">0</span></div><div class="bar hp"><i id="hpbar"></i></div><div class="bar sh"><i id="shbar"></i></div></div><div class="box">👥 <span id="alive">13</span>　⏱ <span id="time">180</span></div></div>
<div class="info" id="info">左クリック：射撃　R：リロード　1/2/3：武器</div>
<div class="bottom"><div class="weapons"><div class="slot sel" id="w1"><b>🔫</b>AR<br><span id="a1">30</span>/120</div><div class="slot" id="w2"><b>💥</b>SHOTGUN<br><span id="a2">6</span>/36</div><div class="slot" id="w3"><b>🎯</b>SMG<br><span id="a3">40</span>/160</div></div><div class="build"><button id="wallBtn">🧱 WALL</button><button id="floorBtn">⬜ FLOOR</button><button id="rampBtn">📐 RAMP</button></div></div><button class="mobileFire" id="fire">FIRE</button></div>
<div class="screen" id="menu"><div class="card"><h1>🌎 MINI BATTLE ROYALE 3D</h1><p>敵を撃って倒せる3Dバトルロイヤル！</p><p>🔫 AR　💥 ショットガン　🎯 SMG<br>🧱 壁　⬜ 床　📐 ランプ</p><button class="start" id="start">バトル開始</button><p>PC：WASD＋マウス＋左クリック<br>スマホ：FIREボタン</p></div></div>
<div class="screen" id="result" style="display:none"><div class="card"><h1 id="resultTitle"></h1><p id="resultDesc"></p><button class="start" onclick="location.reload()">もう一度</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x82c968);scene.fog=new THREE.Fog(0x82c968,90,260);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.getElementById('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbfe9ff,0x54723d,2));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(80,130,40);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(360,360),new THREE.MeshStandardMaterial({color:0x69ad55}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(360,72,0x4c8c43,0x5b994c);grid.position.y=.02;scene.add(grid);
const buildings=[],bullets=[],enemies=[];let playing=false,time=180,stormR=155,weapon=0,cool=0,reload=0,kills=0;const keys={};let mouse={down:false};
const weapons=[{name:'AR',damage:34,rate:.11,mag:30,max:120,pellets:1,spread:.018},{name:'SHOTGUN',damage:15,rate:.75,mag:6,max:36,pellets:8,spread:.12},{name:'SMG',damage:18,rate:.075,mag:40,max:160,pellets:1,spread:.045}];let ammo=[30,6,40],reserve=[120,36,160];
function mat(c){return new THREE.MeshStandardMaterial({color:c})}function box(x,y,z,sx,sy,sz,c,g=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat(c));o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;g.add(o);return o}
for(let i=0;i<42;i++){let x=(Math.random()-.5)*310,z=(Math.random()-.5)*310;if(Math.hypot(x,z)<35)continue;let sx=5+Math.random()*12,sz=5+Math.random()*12,sy=2+Math.random()*10;box(x,sy/2,z,sx,sy,sz,Math.random()<.45?0x7b5a43:0x9b8a63)}
for(let i=0;i<20;i++){let o=new THREE.Mesh(new THREE.CylinderGeometry(1.5,2,8,10),mat(0x347d38));o.position.set((Math.random()-.5)*300,4,(Math.random()-.5)*300);o.castShadow=true;scene.add(o)}
const player={pos:new THREE.Vector3(0,1.7,0),hp:100,shield:50,yaw:0,pitch:0,speed:18};
function enemyMesh(e){const g=new THREE.Group();box(0,1,0,1.5,2,1.5,0xe34f59,g);box(0,2.2,0,1.1,.7,1.1,0xefd0ad,g);g.position.set(e.pos.x,0,e.pos.z);scene.add(g);return g}
function spawnEnemies(){for(let i=0;i<12;i++){let a=Math.random()*Math.PI*2,r=70+Math.random()*70;e={pos:new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r),hp:100,cd:.5+Math.random()*2,speed:6+Math.random()*5,mesh:null};e.mesh=enemyMesh(e);enemies.push(e)}}
function clearEnemies(){for(const e of enemies)scene.remove(e.mesh);enemies.length=0}
function setWeapon(i){weapon=i;document.querySelectorAll('.slot').forEach((s,j)=>s.classList.toggle('sel',j===i))}
function build(type){if(!playing)return;let dir=new THREE.Vector3(Math.sin(player.yaw),0,Math.cos(player.yaw));let p=player.pos.clone().add(dir.multiplyScalar(5));let o;if(type==='wall')o=box(Math.round(p.x/5)*5,2.5,Math.round(p.z/5)*5,5,.35,5,0xb97945);if(type==='floor')o=box(Math.round(p.x/5)*5,.12,Math.round(p.z/5)*5,5,.25,5,0xb97945);if(type==='ramp'){o=box(Math.round(p.x/5)*5,1.5,Math.round(p.z/5)*5,5,3,5,0xb97945);o.rotation.x=-.55}o.userData.life=45;buildings.push(o)}
function showHit(){hit.classList.add('show');clearTimeout(showHit.t);showHit.t=setTimeout(()=>hit.classList.remove('show'),130)}
function shoot(){let w=weapons[weapon];if(!playing||cool>0||reload>0)return;if(ammo[weapon]<=0){reload=.9;return}ammo[weapon]--;cool=w.rate;for(let i=0;i<w.pellets;i++){let dir=new THREE.Vector3((Math.random()-.5)*w.spread,(Math.random()-.5)*w.spread,-1).normalize();dir.applyEuler(new THREE.Euler(player.pitch,player.yaw,0,'YXZ'));let b=new THREE.Mesh(new THREE.SphereGeometry(.13,7,7),mat(0xffed66));b.position.copy(player.pos);b.userData={dir,life:2,damage:w.damage};scene.add(b);bullets.push(b)}}
function enemyShoot(e){let dir=player.pos.clone().add(new THREE.Vector3(0,.5,0)).sub(e.pos.clone().add(new THREE.Vector3(0,1.2,0))).normalize();let b=new THREE.Mesh(new THREE.SphereGeometry(.13,7,7),mat(0xff6570));b.position.copy(e.pos).add(new THREE.Vector3(0,1.2,0));b.userData={dir,life:3,damage:8,enemy:true};scene.add(b);bullets.push(b)}
function damagePlayer(d){let s=Math.min(player.shield,d);player.shield-=s;player.hp-=d-s;if(player.hp<=0)end(false)}
function killEnemy(e){if(e.hp>0)return;e.hp=0;scene.remove(e.mesh);kills++;showHit()}
function end(win){playing=false;document.exitPointerLock?.();result.style.display='grid';resultTitle.textContent=win?'🏆 VICTORY ROYALE!':'💥 GAME OVER';resultDesc.textContent=win?'敵を全員倒した！ KILLS: '+kills:'倒されてしまった… KILLS: '+kills}
function update(dt){if(!playing)return;time-=dt;cool=Math.max(0,cool-dt);if(reload>0){reload-=dt;if(reload<=0){let need=weapons[weapon].mag-ammo[weapon],take=Math.min(need,reserve[weapon]);ammo[weapon]+=take;reserve[weapon]-=take}}
let f=(keys.KeyW?1:0)-(keys.KeyS?1:0),r=(keys.KeyD?1:0)-(keys.KeyA?1:0);let v=new THREE.Vector3(r,0,-f);if(v.length())v.normalize().multiplyScalar(player.speed*dt);v.applyAxisAngle(new THREE.Vector3(0,1,0),player.yaw);player.pos.add(v);player.pos.x=THREE.MathUtils.clamp(player.pos.x,-174,174);player.pos.z=THREE.MathUtils.clamp(player.pos.z,-174,174);player.pos.y=1.7;camera.position.copy(player.pos);camera.rotation.set(player.pitch,player.yaw,0,'YXZ');if(mouse.down)shoot();
for(const e of enemies){if(e.hp<=0)continue;let d=e.pos.distanceTo(new THREE.Vector3(player.pos.x,0,player.pos.z));let dir=new THREE.Vector3(player.pos.x-e.pos.x,0,player.pos.z-e.pos.z);if(d>25){dir.normalize();e.pos.addScaledVector(dir,e.speed*dt)}else{e.cd-=dt;if(e.cd<=0){enemyShoot(e);e.cd=1.2+Math.random()*.8}}e.mesh.position.set(e.pos.x,0,e.pos.z);e.mesh.lookAt(player.pos.x,1,e.pos.z)}
for(const b of bullets){let old=b.position.clone();b.position.addScaledVector(b.userData.dir,45*dt);b.userData.life-=dt;if(b.userData.enemy){if(segmentHit(old,b.position,player.pos,1.7)){damagePlayer(b.userData.damage);b.userData.life=0}}else{for(const e of enemies){if(e.hp<=0)continue;let target=e.pos.clone().add(new THREE.Vector3(0,1.1,0));if(segmentHit(old,b.position,target,2.0)){e.hp-=b.userData.damage;b.userData.life=0;showHit();if(e.hp<=0)killEnemy(e);break}}}if(Math.abs(b.position.x)>185||Math.abs(b.position.z)>185)b.userData.life=0}
for(let i=bullets.length-1;i>=0;i--)if(bullets[i].userData.life<=0){scene.remove(bullets[i]);bullets.splice(i,1)}for(let i=buildings.length-1;i>=0;i--){buildings[i].userData.life-=dt;if(buildings[i].userData.life<=0){scene.remove(buildings[i]);buildings.splice(i,1)}}
stormR=Math.max(35,155-Math.max(0,180-time)*.72);if(Math.hypot(player.pos.x,player.pos.z)>stormR)damagePlayer(7*dt);for(const e of enemies)if(e.hp>0&&Math.hypot(e.pos.x,e.pos.z)>stormR){e.hp-=5*dt;if(e.hp<=0)killEnemy(e)}if(enemies.every(e=>e.hp<=0)||time<=0)end(true);ui()}
function segmentHit(a,b,p,r){const ab=b.clone().sub(a),ap=p.clone().sub(a),t=Math.max(0,Math.min(1,ap.dot(ab)/Math.max(ab.lengthSq(),.0001))),q=a.clone().addScaledVector(ab,t);return q.distanceTo(p)<=r}
function ui(){hp.textContent=Math.ceil(player.hp);shield.textContent=Math.ceil(player.shield);hpbar.style.width=Math.max(0,player.hp)+'%';shbar.style.width=Math.max(0,player.shield)+'%';alive.textContent=enemies.filter(e=>e.hp>0).length+1;time.textContent=Math.ceil(window.time);killsEl.textContent=kills;a1.textContent=ammo[0];a2.textContent=ammo[1];a3.textContent=ammo[2]}
const killsEl=document.getElementById('kills');const timeEl=document.getElementById('time');
function animate(){requestAnimationFrame(animate);update(Math.min(.033,clock.getDelta()));drawStorm();renderer.render(scene,camera)}const clock=new THREE.Clock();let stormMesh;function drawStorm(){if(stormMesh)scene.remove(stormMesh);stormMesh=new THREE.Mesh(new THREE.RingGeometry(stormR-1,stormR,96),new THREE.MeshBasicMaterial({color:0xb77cff,side:THREE.DoubleSide,transparent:true,opacity:.7}));stormMesh.rotation.x=-Math.PI/2;stormMesh.position.y=.05;scene.add(stormMesh)}
renderer.domElement.addEventListener('click',()=>{if(playing)document.body.requestPointerLock()});document.addEventListener('mousemove',e=>{if(document.pointerLockElement){player.yaw-=e.movementX*.0022;player.pitch-=e.movementY*.0022;player.pitch=THREE.MathUtils.clamp(player.pitch,-1.35,1.35)}});document.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true});document.addEventListener('mouseup',()=>mouse.down=false);document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Digit1')setWeapon(0);if(e.code==='Digit2')setWeapon(1);if(e.code==='Digit3')setWeapon(2);if(e.code==='KeyR'&&ammo[weapon]<weapons[weapon].mag)reload=.9});document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('contextmenu',e=>e.preventDefault());
wallBtn.onclick=()=>build('wall');floorBtn.onclick=()=>build('floor');rampBtn.onclick=()=>build('ramp');w1.onclick=()=>setWeapon(0);w2.onclick=()=>setWeapon(1);w3.onclick=()=>setWeapon(2);start.onclick=()=>{menu.style.display='none';playing=true;clearEnemies();spawnEnemies();clock.start();ui()};fire.onclick=shoot;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});animate();
</script></body></html>
