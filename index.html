<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>YOUTUBER VIRAL RUSH</title><style>*{box-sizing:border-box}body{margin:0;background:#10131f;color:#fff;font-family:Arial,sans-serif;overflow:hidden}canvas{display:block;width:100vw;height:100vh;background:linear-gradient(#55b9e8 0 55%,#62c45c 55%)}#ui{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px;gap:8px}.box{background:#111827dd;border:2px solid #ffffff22;border-radius:14px;padding:9px 13px;box-shadow:0 5px 20px #0005}.bar{width:190px;height:12px;background:#222;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#ff355d}.bottom{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#111827dd;border-radius:16px;padding:9px 14px;text-align:center}.screen{position:fixed;inset:0;background:#0009;display:grid;place-items:center}.card{width:min(92vw,560px);padding:30px;border-radius:24px;background:#161d2ddd;text-align:center;box-shadow:0 15px 60px #0009}.card h1{font-size:34px;margin:5px 0 15px}.start{border:0;border-radius:15px;padding:15px 30px;background:#ff3158;color:#fff;font-weight:900;font-size:20px;cursor:pointer}.hint{opacity:.8;font-size:13px}.pop{position:fixed;left:50%;top:45%;font-size:28px;font-weight:900;transform:translate(-50%,-50%);opacity:0;text-shadow:0 3px 5px #000}.pop.on{opacity:1;animation:pop .5s}@keyframes pop{50%{transform:translate(-50%,-70%) scale(1.2)}}@media(max-width:700px){.top{font-size:11px}.bar{width:100px}.bottom{font-size:11px;width:92%}.card h1{font-size:27px}}</style></head><body><canvas id="game"></canvas><div id="ui"><div class="top"><div class="box">📹 <b>YOUTUBER VIRAL RUSH</b><br><small>WASD / 矢印：移動　SPACE：撮影</small></div><div class="box">❤️ <span id="hp">100</span><div class="bar"><i id="hpbar" style="width:100%"></i></div></div><div class="box">👥 登録者 <b id="subs">0</b><br>🔥 バズ <b id="combo">0</b>　💰 <b id="coins">0</b></div></div><div class="bottom">🎬 ネタを集めて撮影！　📈 バズを連鎖させて登録者100,000人を目指せ！</div><div class="pop" id="pop"></div></div><div class="screen" id="menu"><div class="card"><h1>📹 YOUTUBER<br>VIRAL RUSH</h1><p>街を走り回って「ネタ」を集め、動画を撮影！<br>バズを連鎖させて登録者を増やそう。</p><p>🎮 <b>WASD / 矢印</b>：移動　<b>SPACE</b>：撮影<br>📱 画面タップでも撮影</p><button class="start" id="start">撮影スタート！</button><p class="hint">実在の人物・チャンネルを使わないオリジナルゲームです。</p></div></div><div class="screen" id="result" style="display:none"><div class="card"><h1 id="resultTitle"></h1><p id="resultDesc"></p><button class="start" onclick="location.reload()">もう一度撮影する</button></div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,playing=false,last=0,subs=0,coins=0,combo=0,hp=100,videoTimer=0,spawnTimer=0,keys={};const p={x:0,y:0,r:22,s:260};let items=[],enemies=[],particles=[];
function resize(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();function rnd(a,b){return a+Math.random()*(b-a)}
function spawnItem(){items.push({x:rnd(35,W-35),y:rnd(105,H-45),type:Math.random()<.72?'idea':'coin',rot:Math.random()*6.28})}function spawnEnemy(){enemies.push({x:rnd(25,W-25),y:rnd(110,H-35),r:20,s:rnd(45,80)})}function burst(x,y){for(let i=0;i<12;i++)particles.push({x,y,vx:rnd(-130,130),vy:rnd(-130,130),life:.7})}function popup(t){let e=document.getElementById('pop');e.textContent=t;e.classList.remove('on');void e.offsetWidth;e.classList.add('on')}
function reset(){p.x=W/2;p.y=H/2;items=[];enemies=[];particles=[];subs=coins=combo=0;hp=100;for(let i=0;i<18;i++)spawnItem();for(let i=0;i<5;i++)spawnEnemy()}
function shoot(){if(!playing||videoTimer>0)return;videoTimer=.55;let hit=0;for(let i=items.length-1;i>=0;i--){let o=items[i],d=Math.hypot(o.x-p.x,o.y-p.y);if(d<145){hit++;if(o.type==='idea'){let gain=100+combo*25;subs+=gain;combo++;popup('📹 +'+gain+' 登録者！')}else{coins++;popup('💰 +1 コイン！')}burst(o.x,o.y);items.splice(i,1)}}if(!hit){combo=0;popup('😵 ネタがない！')}while(items.length<18)spawnItem()}
function update(dt){let dx=(keys.a||keys.ArrowLeft?-1:0)+(keys.d||keys.ArrowRight?1:0),dy=(keys.w||keys.ArrowUp?-1:0)+(keys.s||keys.ArrowDown?1:0);if(dx||dy){let l=Math.hypot(dx,dy);p.x+=dx/l*p.s*dt;p.y+=dy/l*p.s*dt}p.x=Math.max(25,Math.min(W-25,p.x));p.y=Math.max(100,Math.min(H-35,p.y));videoTimer=Math.max(0,videoTimer-dt);spawnTimer-=dt;if(spawnTimer<0){spawnTimer=2;spawnEnemy()}for(const e of enemies){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.s*dt;e.y+=dy/d*e.s*dt;if(d<p.r+e.r){hp-=22*dt;combo=0}}for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt}particles=particles.filter(q=>q.life>0);document.getElementById('hp').textContent=Math.max(0,Math.ceil(hp));document.getElementById('hpbar').style.width=Math.max(0,hp)+'%';document.getElementById('subs').textContent=subs.toLocaleString();document.getElementById('coins').textContent=coins;document.getElementById('combo').textContent=combo;if(hp<=0)end(false);if(subs>=100000)end(true)}
function draw(){ctx.clearRect(0,0,W,H);ctx.globalAlpha=.2;ctx.fillStyle='#fff';for(let x=0;x<W;x+=55)for(let y=95;y<H;y+=55)ctx.fillRect(x,y,1,1);ctx.globalAlpha=1;for(const o of items){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot+=.02);ctx.font='28px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.type==='idea'?'💡':'🪙',0,0);ctx.restore()}for(const e of enemies){ctx.font='32px Arial';ctx.textAlign='center';ctx.fillText('😈',e.x,e.y)}for(const q of particles){ctx.globalAlpha=Math.max(0,q.life/.7);ctx.fillStyle='#ffe14d';ctx.fillRect(q.x,q.y,5,5)}ctx.globalAlpha=1;ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#ff3158';ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();ctx.font='25px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🎥',0,0);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.restore();if(videoTimer>0){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,145,0,Math.PI*2);ctx.stroke()}}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(playing)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space'){e.preventDefault();shoot()}if(e.key.toLowerCase()==='h'&&playing){hp=Math.min(100,hp+20);popup('❤️ 回復！')}});addEventListener('keyup',e=>keys[e.key]=false);c.addEventListener('pointerdown',shoot);document.getElementById('start').onclick=()=>{reset();playing=true;document.getElementById('menu').style.display='none'};function end(win){if(!playing)return;playing=false;document.getElementById('result').style.display='grid';document.getElementById('resultTitle').textContent=win?'🏆 100,000人達成！':'💥 撮影終了…';document.getElementById('resultDesc').textContent=win?'チャンネルが超バズった！ 登録者 '+subs.toLocaleString()+'人':'登録者 '+subs.toLocaleString()+'人 / コイン '+coins+'枚'}
</script></body></html>
