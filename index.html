<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mini Brawler Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;user-select:none}canvas{display:block;width:100vw;height:100vh;background:#25432b}button{font:inherit;cursor:pointer}.hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;align-items:center;justify-content:space-between;padding:12px;gap:8px}.pill{background:#101722dd;border:1px solid #ffffff22;border-radius:14px;padding:8px 12px;font-weight:900;box-shadow:0 6px 20px #0004}.hp{min-width:160px}.hpbar{height:8px;background:#0008;border-radius:20px;overflow:hidden;margin-top:5px}.hpbar i{display:block;height:100%;width:100%;background:#45e07c}.screen{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#08101acc,#000c);z-index:10;padding:20px}.card{width:min(92vw,500px);background:#18202b;border:1px solid #ffffff18;border-radius:24px;padding:30px;box-shadow:0 24px 90px #0008;text-align:center}.logo{font-size:clamp(36px,8vw,62px);font-weight:1000;letter-spacing:-2px;margin:0 0 8px}.sub{color:#b8c1ce;margin:0 0 20px}.mode{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.mode button{padding:12px;border:1px solid #ffffff22;border-radius:15px;background:#101722;color:#fff;font-weight:900}.mode button.active{outline:3px solid #56d7ff;background:#203042}.start{width:100%;padding:15px;border:0;border-radius:16px;background:#53dd7e;color:#06120a;font-size:20px;font-weight:1000}.hint{font-size:13px;color:#99a4b2;margin-top:14px;line-height:1.55}.result h2{font-size:48px;margin:5px 0}.result button{padding:13px 22px;border:0;border-radius:14px;background:#53dd7e;font-weight:1000}.ammo{position:fixed;left:16px;bottom:18px;display:flex;gap:5px}.ammo span{width:14px;height:26px;border-radius:5px 5px 4px 4px;background:#ffe16b;border:1px solid #fff6}.ammo span.off{opacity:.2}.superbox{position:fixed;left:16px;bottom:52px;width:min(250px,55vw);height:15px;background:#0008;border-radius:20px;overflow:hidden;border:1px solid #ffffff22}.superbox i{display:block;height:100%;width:0;background:linear-gradient(90deg,#915cf7,#d6a4ff)}.supertxt{position:fixed;left:22px;bottom:70px;font-size:12px;font-weight:1000;text-shadow:0 2px 4px #000}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:#101722dd;border:1px solid #ffffff22;font-weight:1000;opacity:0;transition:.2s}.toast.show{opacity:1}.touch{display:none}.stick{position:fixed;width:82px;height:82px;border-radius:50%;background:#ffffff14;border:1px solid #ffffff2a}.up{left:64px;bottom:150px}.down{left:64px;bottom:28px}.left{left:4px;bottom:89px}.right{left:124px;bottom:89px}.touchbtn{position:fixed;border-radius:50%;display:grid;place-items:center;border:1px solid #fff4;color:#fff;font-weight:1000}.attack{right:18px;bottom:24px;width:102px;height:102px;background:#e74d5b}.superbtn{right:48px;bottom:145px;width:80px;height:48px;border-radius:15px;background:#8958ef;display:none}.aimline{position:fixed;inset:0;pointer-events:none}
@media(max-width:700px){.touch{display:block}.attack,.superbtn{display:grid}.top{padding:8px;font-size:12px}.pill{padding:7px 9px}.hp{min-width:130px}.hint{font-size:12px}.mode{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="top">
    <div class="pill">⚡ MINI BRAWLER</div>
    <div class="pill hp"><div id="hpText">HP 160 / 160</div><div class="hpbar"><i id="hpBar"></i></div></div>
    <div class="pill">⏱ <span id="time">90</span></div>
  </div>
  <div class="supertxt" id="superText">SUPER 0%</div><div class="superbox"><i id="superBar"></i></div>
  <div class="ammo" id="ammo"></div>
  <div class="toast" id="toast"></div>
</div>
<div class="screen" id="menu"><div class="card"><h1 class="logo">MINI BRAWLER</h1><p class="sub">オリジナルの3v3トップダウンアクション</p><div class="mode"><button data-mode="rush" class="active">RUSH</button><button data-mode="balanced">BALANCED</button><button data-mode="tank">TANK</button></div><p id="modeDesc" class="hint">移動と連射が速い。攻撃力は控えめ。</p><button class="start" id="startBtn">ゲーム開始</button><div class="hint">PC：WASD / 矢印 ＋ マウスクリック<br>スマホ：画面ボタン ＋ ATTACK / SUPER</div></div></div>
<div class="screen" id="result" style="display:none"><div class="card result"><div id="resultIcon" style="font-size:58px">🏆</div><h2 id="resultTitle">勝利！</h2><p id="resultDesc"></p><button id="again">もう一度遊ぶ</button></div></div>
<div class="touch"><div class="stick up" data-k="w">▲</div><div class="stick down" data-k="s">▼</div><div class="stick left" data-k="a">◀</div><div class="stick right" data-k="d">▶</div><div class="touchbtn attack" id="attackBtn">ATTACK</div><div class="touchbtn superbtn" id="superBtn">SUPER</div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const keys={};const pointer={x:W/2,y:H/2,down:false};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY});canvas.addEventListener('pointerdown',e=>{pointer.down=true;pointer.x=e.clientX;pointer.y=e.clientY});addEventListener('pointerup',()=>pointer.down=false);
const modes={rush:{hp:140,speed:275,damage:21,fire:.18,color:'#45c9ff',desc:'移動と連射が速い。攻撃力は控えめ。'},balanced:{hp:160,speed:245,damage:27,fire:.28,color:'#62dd79',desc:'HP・移動・攻撃のバランス型。'},tank:{hp:220,speed:205,damage:34,fire:.42,color:'#ffbe55',desc:'HPと一発の威力が高い。ゆっくり動く。'}};let chosen='rush';let state='menu',timeLeft=90,last=0;let player,enemies=[],allies=[],bullets=[],walls=[],particles=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);const say=t=>{const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>e.classList.remove('show'),900)};
function makeChar(x,y,team,kind='bot'){return{x,y,r:20,team,kind,hp:100,maxHp:100,speed:160,damage:18,fire:1,cd:0,super:0,dead:false,flash:0}};
function setup(){const m=modes[chosen];player=makeChar(W*.18,H*.5,'p','player');Object.assign(player,{maxHp:m.hp,hp:m.hp,speed:m.speed,damage:m.damage,fire:m.fire,r:21});enemies=[];allies=[];bullets=[];particles=[];timeLeft=90;walls=[{x:W*.34,y:H*.14,w:W*.12,h:H*.22},{x:W*.54,y:H*.62,w:W*.12,h:H*.2},{x:W*.46,y:H*.38,w:W*.08,h:H*.18},{x:W*.73,y:H*.2,w:W*.1,h:H*.22},{x:W*.72,y:H*.6,w:W*.1,h:H*.2}];for(let i=0;i<2;i++){const a=makeChar(W*(.27+i*.09),H*(.28+i*.38),'a');Object.assign(a,{maxHp:110,hp:110,speed:175,damage:16,fire:.7,cd:.4+i*.3});allies.push(a)}for(let i=0;i<3;i++){const e=makeChar(W*(.67+i*.09),H*(.27+i*.21),'e');Object.assign(e,{maxHp:110+25*i,hp:110+25*i,speed:150+i*8,damage:16+3*i,fire:.62+i*.08,cd:.4+i*.25});enemies.push(e)}
updateAmmo();updateHud();}
function blocked(x,y,r){if(x-r<8||x+r>W-8||y-r<78||y+r>H-8)return true;return walls.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h)}
function move(o,dx,dy){const nx=o.x+dx,ny=o.y+dy;if(!blocked(nx,o.y,o.r))o.x=nx;if(!blocked(o.x,ny,o.r))o.y=ny}
function fire(shooter,tx,ty,team,damage,spread=0){const a=Math.atan2(ty-shooter.y,tx-shooter.x)+(Math.random()-.5)*spread;bullets.push({x:shooter.x,y:shooter.y,vx:Math.cos(a)*590,vy:Math.sin(a)*590,team,damage,life:1.3,r:5});for(let i=0;i<3;i++)particles.push({x:shooter.x,y:shooter.y,vx:Math.cos(a)*(40+i*20),vy:Math.sin(a)*(40+i*20),life:.2,max:.2})}
function shootPlayer(){if(state!=='play'||player.dead||player.cd>0||player.ammo<=0)return;fire(player,pointer.x,pointer.y,'p',player.damage,.05);player.ammo--;player.cd=player.fire;player.reload=0;updateAmmo()}
function superAttack(){if(state!=='play'||player.super<100)return;const a=Math.atan2(pointer.y-player.y,pointer.x-player.x);for(let i=-3;i<=3;i++){const ang=a+i*.09;bullets.push({x:player.x,y:player.y,vx:Math.cos(ang)*640,vy:Math.sin(ang)*640,team:'p',damage:58,life:1.05,r:7})}player.super=0;say('SUPER!');}
function nearest(o,list){let best=null,bd=1e9;for(const e of list)if(!e.dead){const d=dist(o,e);if(d<bd){bd=d;best=e}}return best}
function aiMoveBot(bot,dt,target){if(!target)return;const d=dist(bot,target);const a=Math.atan2(target.y-bot.y,target.x-bot.x);let mx=0,my=0;if(d>270){mx=Math.cos(a);my=Math.sin(a)}else if(d<150){mx=-Math.cos(a);my=-Math.sin(a)}else{const s=Math.sin((performance.now()+bot.x)*.001);mx=-Math.sin(a)*s;my=Math.cos(a)*s}move(bot,mx*bot.speed*dt,my*bot.speed*dt);bot.cd-=dt;if(d<500&&bot.cd<=0){fire(bot,target.x,target.y,bot.team,bot.damage,.08);bot.cd=bot.fire}}
function hurt(target,damage,team){target.hp-=damage;target.flash=.08;particles.push({x:target.x,y:target.y,vx:0,vy:0,life:.18,max:.18,big:true});if(team==='e'&&target===player){}if(target.hp<=0&&!target.dead){target.hp=0;target.dead=true;for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2;particles.push({x:target.x,y:target.y,vx:Math.cos(a)*(40+Math.random()*140),vy:Math.sin(a)*(40+Math.random()*140),life:.45,max:.45})}if(target===player)end(false);}}
function updateBullets(dt){for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(blocked(b.x,b.y,b.r))b.life=0;if(b.life<=0)continue;const targets=b.team==='p'?enemies:(b.team==='e'?[player,...allies]:[...enemies]);for(const t of targets){if(t.dead)continue;if(dist(b,t)<t.r+b.r){hurt(t,b.damage,b.team);b.life=0;if(b.team==='p'){player.super=clamp(player.super+(t.dead?25:9),0,100)}break}}}bullets=bullets.filter(b=>b.life>0)}
function update(dt){if(state!=='play')return;timeLeft-=dt;if(timeLeft<=0){timeLeft=0;end(enemies.every(e=>e.dead));return}player.cd=Math.max(0,player.cd-dt);player.reload=(player.reload||0)+dt;if(player.reload>.75&&player.ammo<3){player.ammo++;player.reload=0;updateAmmo()}
let dx=0,dy=0;if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;const len=Math.hypot(dx,dy)||1;move(player,dx/len*player.speed*dt,dy/len*player.speed*dt);if(pointer.down)shootPlayer();
for(const a of allies){if(a.dead)continue;a.cd-=dt;aiMoveBot(a,dt,nearest(a,enemies));}
for(const e of enemies){if(e.dead)continue;aiMoveBot(e,dt,nearest(e,[player,...allies]));}
updateBullets(dt);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);if(enemies.every(e=>e.dead))end(true);updateHud()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#214128';ctx.fillRect(0,0,W,H);for(let y=0;y<H;y+=52)for(let xx=0;xx<W;xx+=52){ctx.fillStyle=((xx/52+y/52)%2?'#23482a':'#214329');ctx.fillRect(xx,y,52,52)}for(const w of walls){ctx.fillStyle='#707874';ctx.fillRect(w.x,w.y,w.w,w.h);ctx.fillStyle='#848d87';ctx.fillRect(w.x+4,w.y+4,w.w-8,5);ctx.strokeStyle='#b9c0bc';ctx.lineWidth=2;ctx.strokeRect(w.x,w.y,w.w,w.h)}for(let i=0;i<8;i++){ctx.fillStyle='#2e6637';ctx.beginPath();ctx.arc((i*163+57)%W,(i*97+90)%H,18,0,Math.PI*2);ctx.fill()}
for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.big?'#fff':'#f6d36a';ctx.beginPath();ctx.arc(p.x,p.y,p.big?12:4,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const b of bullets){ctx.fillStyle=b.team==='p'?'#9beeff':'#ff9aa5';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}
for(const a of allies)if(!a.dead)drawChar(a,'#55c6ff','ALLY');for(const e of enemies)if(!e.dead)drawChar(e,'#ef626b','ENEMY');if(player&&!player.dead)drawChar(player,modes[chosen].color,'YOU');
}
function drawChar(o,col,label){ctx.save();ctx.translate(o.x,o.y);if(o.flash>0){ctx.globalAlpha=.7;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,o.r+5,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#0008';ctx.fillRect(-24,-33,48,7);ctx.fillStyle=o.team==='e'?'#ff5963':'#45e07c';ctx.fillRect(-24,-33,48*clamp(o.hp/o.maxHp,0,1),7);ctx.fillStyle='#fff';ctx.font='900 11px system-ui';ctx.textAlign='center';ctx.fillText(label,0,4);ctx.restore();o.flash=Math.max(0,o.flash-.016)}
function updateAmmo(){const a=document.getElementById('ammo');a.innerHTML='';for(let i=0;i<3;i++){const s=document.createElement('span');if(i>=player.ammo)s.className='off';a.appendChild(s)}}
function updateHud(){if(!player)return;document.getElementById('hpText').textContent=`HP ${Math.ceil(player.hp)} / ${player.maxHp}`;document.getElementById('hpBar').style.width=`${clamp(player.hp/player.maxHp,0,1)*100}%`;document.getElementById('time').textContent=Math.ceil(timeLeft);document.getElementById('superBar').style.width=`${player.super}%`;document.getElementById('superText').textContent=player.super>=100?'SUPER READY':'SUPER '+Math.floor(player.super)+'%'}
function end(win){if(state!=='play')return;state='result';document.getElementById('result').style.display='grid';document.getElementById('resultIcon').textContent=win?'🏆':'💥';document.getElementById('resultTitle').textContent=win?'勝利！':'敗北…';document.getElementById('resultDesc').textContent=win?'相手チームを全員倒しました！':'味方チームが倒されました。';}
function loop(t){const dt=Math.min(.033,(t-last||16)/1000);last=t;if(state==='play')update(dt);draw();requestAnimationFrame(loop)}
for(const b of document.querySelectorAll('.mode button'))b.onclick=()=>{document.querySelectorAll('.mode button').forEach(x=>x.classList.remove('active'));b.classList.add('active');chosen=b.dataset.mode;document.getElementById('modeDesc').textContent=modes[chosen].desc};
document.getElementById('startBtn').onclick=()=>{setup();state='play';document.getElementById('menu').style.display='none';say('FIGHT!')};document.getElementById('again').onclick=()=>location.reload();document.getElementById('attackBtn').onpointerdown=e=>{e.preventDefault();shootPlayer()};document.getElementById('superBtn').onpointerdown=e=>{e.preventDefault();superAttack()};document.querySelectorAll('.stick').forEach(el=>{const k=el.dataset.k;const on=e=>{e.preventDefault();keys[k]=true};const off=()=>keys[k]=false;el.addEventListener('pointerdown',on);['pointerup','pointercancel','pointerleave'].forEach(v=>el.addEventListener(v,off))});addEventListener('keydown',e=>{if(e.code==='Space')superAttack()});
requestAnimationFrame(loop);
</script>
</body>
</html>
