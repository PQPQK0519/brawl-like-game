<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ツムツム風パズル DX</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#7edcff,#f9c8ef);min-height:100vh;color:#45224f}#app{width:min(100%,760px);margin:auto;padding:12px}.top{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#ffffffdf;border-radius:20px;padding:9px;box-shadow:0 6px 20px #704b7a33}.stat{text-align:center}.label{font-size:10px;opacity:.6;font-weight:800}.value{font-size:21px;font-weight:1000}.boardWrap{margin-top:10px;background:#ffffff77;border:5px solid #fff;border-radius:25px;padding:9px;box-shadow:0 8px 25px #704b7a33}.board{position:relative;width:100%;aspect-ratio:1;overflow:hidden;border-radius:18px;background:radial-gradient(circle at 50% 20%,#fff,#e7f4ff);touch-action:none}.tsum{position:absolute;width:12.2%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(20px,6vw,42px);cursor:pointer;user-select:none;transform:translate(-50%,-50%);filter:drop-shadow(0 5px 3px #0003);transition:left .22s,top .22s,transform .12s,opacity .15s}.tsum:after{content:'';position:absolute;inset:8%;border-radius:50%;border:2px solid #ffffff99}.tsum.selected{transform:translate(-50%,-50%) scale(1.22);filter:drop-shadow(0 0 10px #fff)}.bomb{animation:pulse .7s infinite alternate}.bomb:before{content:'💣';position:absolute;font-size:.62em;right:-4%;top:-4%}@keyframes pulse{to{filter:drop-shadow(0 0 10px #fff)}}.bottom{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;margin-top:10px}.btn{border:0;border-radius:14px;padding:11px 5px;background:#fff;color:#45224f;font-weight:900;box-shadow:0 4px 12px #704b7a33;cursor:pointer}.btn:active{transform:scale(.96)}.skill{background:#ffd65a}.gacha{background:#d9b5ff}.rank{background:#9ee7ff}.combo{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-weight:1000;font-size:clamp(27px,9vw,64px);color:#ff4d9d;text-shadow:0 4px #fff;pointer-events:none;opacity:0;z-index:20;white-space:nowrap}.combo.show{animation:pop .7s}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%,70%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}.bar{height:10px;background:#ddd;border-radius:20px;margin:7px 2px 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffcf4a,#ff6cae);transition:.2s}.modal{position:fixed;inset:0;background:#32143d99;display:grid;place-items:center;padding:18px;z-index:50}.card{background:#fff;border-radius:25px;padding:24px;text-align:center;max-width:500px;width:100%;box-shadow:0 15px 50px #0004}.card h1{margin-top:0}.start{border:0;border-radius:16px;background:#ff6fae;color:#fff;font-size:19px;font-weight:900;padding:14px 28px;cursor:pointer}.panel{display:none;position:fixed;inset:0;background:#32143d99;z-index:60;place-items:center;padding:18px}.panel .card{max-height:90vh;overflow:auto}.tumbler{font-size:55px;margin:8px}.small{font-size:13px;opacity:.7}.rankrow{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee}.close{margin-top:12px;width:100%}@media(max-width:520px){.bottom{grid-template-columns:1fr 1fr}.top{grid-template-columns:repeat(4,1fr)}.value{font-size:18px}}
</style></head>
<body><div id="app">
<div class="top"><div class="stat"><div class="label">SCORE</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">TIME</div><div class="value" id="time">60</div></div><div class="stat"><div class="label">FEVER</div><div class="value" id="fever">0%</div></div><div class="stat"><div class="label">SKILL</div><div class="value" id="skillGauge">0%</div></div></div>
<div class="bar"><i id="skillBar"></i></div><div class="boardWrap"><div id="board" class="board"><div id="combo" class="combo">COMBO!</div></div></div>
<div class="bottom"><button class="btn" id="shuffle">🔄 シャッフル</button><button class="btn skill" id="skill">⭐ スキル</button><button class="btn gacha" id="gacha">🎁 ガチャ</button><button class="btn rank" id="ranking">🏆 ランキング</button></div></div>
<div id="menu" class="modal"><div class="card"><h1>🌈 ツムツム風 DX</h1><p>同じツムを3個以上つなげよう！<br>長いチェーン、ボム、フィーバー、スキル、ガチャ、ランキングまで全部入り！</p><button class="start" id="start">ゲームスタート</button></div></div>
<div id="result" class="modal" style="display:none"><div class="card"><h1>🎉 TIME UP!</h1><h2 id="final">SCORE 0</h2><p id="newRecord"></p><button class="start" id="again">もう一度遊ぶ</button></div></div>
<div id="gachaPanel" class="panel"><div class="card"><h1>🎁 マイツムガチャ</h1><div class="tumbler" id="gachaIcon">🐭</div><h2 id="myTsum">マイツム：🐭</h2><p class="small">ゲーム中のスキルでマイツムを大量消去！<br>スコア500で1回ガチャできます。</p><button class="start" id="doGacha">500でガチャ</button><button class="btn close" data-close="gachaPanel">閉じる</button></div></div>
<div id="rankPanel" class="panel"><div class="card"><h1>🏆 ローカルランキング</h1><div id="rankList"></div><button class="btn close" data-close="rankPanel">閉じる</button></div></div>
<script>
const board=document.querySelector('#board'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),feverEl=document.querySelector('#fever'),skillGaugeEl=document.querySelector('#skillGauge'),skillBar=document.querySelector('#skillBar'),comboEl=document.querySelector('#combo');
const types=['🐭','🐱','🐶','🐰','🦊','🐻'];const colors=['#ff6b81','#62b0ff','#8bdc65','#ffbf5b','#b987ff','#b86f4b'];const N=7;let cells=[],selected=[],score=0,time=60,fever=0,skillGauge=0,playing=false,timer,myTsum=localStorage.getItem('myTsum')||types[0],combo=0;
function rnd(n){return Math.floor(Math.random()*n)}
function pos(i){return {col:i%N,row:Math.floor(i/N)}}
function setPos(e,i){const p=pos(i);e.style.left=((p.col+.5)/N*100)+'%';e.style.top=((p.row+.5)/N*100)+'%'}
function newTsum(type=rnd(types.length)){const e=document.createElement('div');e.className='tsum';e.textContent=types[type];e.dataset.type=type;e.style.background=colors[type];e.addEventListener('pointerdown',ev=>startSelect(e,ev));e.addEventListener('pointerenter',()=>extendSelect(e));return e}
function makeBoard(){cells=[];board.querySelectorAll('.tsum').forEach(x=>x.remove());for(let i=0;i<N*N;i++){const e=newTsum();setPos(e,i);board.appendChild(e);cells.push(e)}}
function startSelect(e,ev){if(!playing||e.classList.contains('bomb'))return;ev.preventDefault();selected=[e];e.classList.add('selected');try{board.setPointerCapture(ev.pointerId)}catch{}}
function extendSelect(e){if(!playing||!selected.length||selected.includes(e)||e.classList.contains('bomb'))return;const last=selected[selected.length-1],a=cells.indexOf(last),b=cells.indexOf(e),ar=Math.floor(a/N),ac=a%N,br=Math.floor(b/N),bc=b%N;if(Math.abs(ar-br)<=1&&Math.abs(ac-bc)<=1&&Number(e.dataset.type)===Number(selected[0].dataset.type)){selected.push(e);e.classList.add('selected')}}
board.addEventListener('pointerup',finishSelect);board.addEventListener('pointercancel',finishSelect);
function finishSelect(){if(!selected.length)return;const chain=[...selected];selected=[];chain.forEach(e=>e.classList.remove('selected'));const n=chain.length;if(n<3)return;combo++;const gain=n*n*10*(fever>=100?2:1)+Math.max(0,combo-1)*5;score+=gain;fever=Math.min(100,fever+n*7);skillGauge=Math.min(100,skillGauge+n*5);updateUI();chain.forEach(e=>{const i=cells.indexOf(e);if(i>=0){cells[i]=null;e.remove()}});if(n>=5){makeBomb(Math.max(0,Math.floor(Math.random()*N*N)))}dropAndFill();if(fever>=100)startFever();showCombo(n>=7?'🔥 '+n+' CHAIN!':'✨ '+n+' CHAIN!')}
function dropAndFill(){for(let col=0;col<N;col++){let write=N-1;for(let row=N-1;row>=0;row--){const i=row*N+col;if(cells[i]){const target=write*N+col;if(target!==i){cells[target]=cells[i];cells[i]=null;setPos(cells[target],target)}write--}}for(let row=write;row>=0;row--){const e=newTsum();const i=row*N+col;cells[i]=e;board.appendChild(e);setPos(e,i)}}}
function makeBomb(i){if(cells[i]){cells[i].classList.add('bomb');cells[i].dataset.bomb='1'}}
function activateBomb(e){const center=cells.indexOf(e);if(center<0)return;const p=pos(center);let removed=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(Math.abs(r-p.row)<=1&&Math.abs(c-p.col)<=1){const x=cells[r*N+c];if(x){removed.push(x);cells[r*N+c]=null;x.remove()}}score+=removed.length*80;skillGauge=Math.min(100,skillGauge+10);updateUI();dropAndFill();showCombo('💣 BOMB!')}
board.addEventListener('dblclick',e=>{const x=e.target.closest('.bomb');if(x&&playing)activateBomb(x)});
function startFever(){fever=0;time=Math.min(60,time+5);score+=1000;skillGauge=Math.min(100,skillGauge+20);updateUI();showCombo('⭐ FEVER TIME!')}
function showCombo(t){comboEl.textContent=t;comboEl.classList.remove('show');void comboEl.offsetWidth;comboEl.classList.add('show')}
function updateUI(){scoreEl.textContent=score.toLocaleString();timeEl.textContent=time;feverEl.textContent=fever+'%';skillGaugeEl.textContent=skillGauge+'%';skillBar.style.width=skillGauge+'%'}
function shuffle(){if(playing)makeBoard()}
function skill(){if(!playing||skillGauge<100)return;skillGauge=0;const all=[...board.querySelectorAll('.tsum')];const mine=all.filter(e=>e.dataset.type==types.indexOf(myTsum));let target=mine.length?mine:all.slice(0,10);target.forEach(e=>{const i=cells.indexOf(e);if(i>=0)cells[i]=null;e.remove()});score+=target.length*100;dropAndFill();updateUI();showCombo('🌟 '+myTsum+' SKILL!')}
function start(){score=0;time=60;fever=0;skillGauge=0;combo=0;playing=true;updateUI();makeBoard();document.querySelector('#menu').style.display='none';document.querySelector('#result').style.display='none';clearInterval(timer);timer=setInterval(()=>{time--;updateUI();if(time<=0)end()},1000)}
function end(){playing=false;clearInterval(timer);const ranks=JSON.parse(localStorage.getItem('tsumRanks')||'[]');ranks.push(score);ranks.sort((a,b)=>b-a);const top=ranks.slice(0,10);localStorage.setItem('tsumRanks',JSON.stringify(top));document.querySelector('#final').textContent='SCORE '+score.toLocaleString();document.querySelector('#newRecord').textContent=top[0]===score?'🏆 ハイスコア！':'ランキング '+(top.indexOf(score)+1)+'位';document.querySelector('#result').style.display='grid'}
function renderRanks(){const ranks=JSON.parse(localStorage.getItem('tsumRanks')||'[]');document.querySelector('#rankList').innerHTML=ranks.length?ranks.map((s,i)=>`<div class="rankrow"><b>${i+1}位</b><span>${s.toLocaleString()}</span></div>`).join(''):'まだ記録がありません'}
document.querySelector('#start').onclick=start;document.querySelector('#again').onclick=start;document.querySelector('#shuffle').onclick=shuffle;document.querySelector('#skill').onclick=skill;document.querySelector('#gacha').onclick=()=>document.querySelector('#gachaPanel').style.display='grid';document.querySelector('#ranking').onclick=()=>{renderRanks();document.querySelector('#rankPanel').style.display='grid'};
document.querySelector('#doGacha').onclick=()=>{if(score<500){showCombo('💰 SCORE不足');return}score-=500;myTsum=types[rnd(types.length)];localStorage.setItem('myTsum',myTsum);document.querySelector('#gachaIcon').textContent=myTsum;document.querySelector('#myTsum').textContent='マイツム：'+myTsum;updateUI();showCombo('🎁 GET '+myTsum)};
document.querySelector('#myTsum').textContent='マイツム：'+myTsum;document.querySelector('#gachaIcon').textContent=myTsum;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.querySelector('#'+b.dataset.close).style.display='none');
</script></body></html>
