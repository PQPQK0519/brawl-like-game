<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ツムツム</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif}body{background:linear-gradient(#70d7ff 0,#bceeff 48%,#f7d6ff 100%);color:#4b2355;overflow-x:hidden}.game{width:min(100%,720px);margin:auto;padding:10px 10px 22px}.hud{background:linear-gradient(#fff,#fff6);border:3px solid #fff;border-radius:22px;padding:8px;box-shadow:0 5px 16px #5a337044}.hudrow{display:flex;align-items:center;justify-content:space-around}.stat{text-align:center;min-width:75px}.stat small{display:block;font-weight:900;font-size:10px;opacity:.65}.stat b{font-size:24px;text-shadow:0 2px #fff}.heart{font-size:22px}.meter{height:11px;border-radius:10px;background:#ddd;overflow:hidden;margin-top:6px;border:2px solid #fff}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffbd36,#ff5eab);transition:width .15s}.boardbox{margin-top:9px;padding:7px;border-radius:28px;background:#ffffffaa;border:4px solid #fff;box-shadow:0 8px 25px #54335a44}.board{position:relative;width:100%;aspect-ratio:1;background:radial-gradient(circle at 50% 15%,#fff,#e8f7ff 70%,#ccecff);border-radius:21px;overflow:hidden;touch-action:none}.piece{position:absolute;width:13.4%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(25px,7vw,50px);line-height:1;user-select:none;cursor:pointer;filter:drop-shadow(0 5px 3px #0004);transform:translate(-50%,-50%);transition:left .28s cubic-bezier(.2,.8,.2,1),top .42s cubic-bezier(.15,.75,.25,1),transform .1s,opacity .12s}.piece:after{content:"";position:absolute;inset:7%;border-radius:50%;border:2px solid #fff9;box-shadow:inset 0 2px 5px #fff8}.piece.sel{transform:translate(-50%,-50%) scale(1.18);filter:drop-shadow(0 0 9px #fff)}.piece.pop{opacity:0;transform:translate(-50%,-50%) scale(1.5)}.piece.falling{transition:top .5s cubic-bezier(.15,.75,.25,1)}.bomb{font-size:clamp(28px,8vw,54px)}.bomb:after{border-color:#fff}.line{position:absolute;height:8px;background:#fff9;border-radius:10px;transform-origin:0 50%;pointer-events:none;z-index:2}.toast{position:absolute;z-index:10;left:50%;top:45%;transform:translate(-50%,-50%) scale(.5);font-size:clamp(28px,10vw,68px);font-weight:1000;color:#ff4b9e;text-shadow:0 4px #fff,0 0 14px #fff;opacity:0;pointer-events:none;white-space:nowrap}.toast.show{animation:toast .65s ease-out}@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.btn{border:0;border-radius:16px;padding:11px 5px;background:#fff;color:#51255c;font-weight:1000;box-shadow:0 4px 10px #5a337033;cursor:pointer}.btn:active{transform:scale(.95)}.skill{background:#ffd44e}.sub{font-size:10px;display:block;opacity:.65}.modal{position:fixed;inset:0;background:#32133eaa;z-index:50;display:grid;place-items:center;padding:18px}.card{width:min(500px,100%);background:linear-gradient(#fff,#fff5);border:4px solid #fff;border-radius:28px;padding:25px;text-align:center;box-shadow:0 18px 55px #0005}.logo{font-size:48px;margin:0 0 5px;text-shadow:0 4px #ffd0e8}.start{border:0;border-radius:20px;padding:15px 34px;background:linear-gradient(#ff7ab8,#ff4d9c);color:#fff;font-size:21px;font-weight:1000;box-shadow:0 6px 0 #c83d78;cursor:pointer}.panel{display:none;position:fixed;inset:0;background:#32133eaa;z-index:60;place-items:center;padding:18px}.panel .card{max-height:90vh;overflow:auto}.rank{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid #ddd}.close{width:100%;margin-top:12px}@media(max-width:500px){.buttons{grid-template-columns:1fr 1fr}.stat b{font-size:19px}.game{padding-top:5px}}
</style>
</head>
<body>
<div class="game">
  <div class="hud"><div class="hudrow"><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>TIME</small><b id="time">60</b></div><div class="stat"><small>COMBO</small><b id="comboNum">0</b></div><div class="heart">❤️</div></div><div class="meter"><i id="feverBar"></i></div></div>
  <div class="boardbox"><div id="board" class="board"><div id="toast" class="toast"></div></div></div>
  <div class="buttons"><button class="btn" id="shuffle">🔄<span class="sub">シャッフル</span></button><button class="btn skill" id="skill">⭐<span class="sub">スキル</span></button><button class="btn" id="gacha">🎁<span class="sub">マイツム</span></button><button class="btn" id="ranking">🏆<span class="sub">ランキング</span></button></div>
</div>
<div id="startModal" class="modal"><div class="card"><div class="logo">🌈 ツムツム</div><h2>同じツムをなぞってつなごう！</h2><p>3個以上つなぐと消えるよ。<br>長くつなぐほど高得点！</p><button class="start" id="start">ゲームスタート</button></div></div>
<div id="resultModal" class="modal" style="display:none"><div class="card"><div class="logo">🎉 TIME UP!</div><h2 id="final">0</h2><p id="record"></p><button class="start" id="again">もう一度遊ぶ</button></div></div>
<div id="gachaPanel" class="panel"><div class="card"><div style="font-size:60px" id="myIcon">🐭</div><h2>🎁 マイツム</h2><p>スコア500でランダムなマイツムをゲット！</p><button class="start" id="doGacha">500でガチャ</button><button class="btn close" data-close="gachaPanel">閉じる</button></div></div>
<div id="rankPanel" class="panel"><div class="card"><h2>🏆 ランキング</h2><div id="rankList"></div><button class="btn close" data-close="rankPanel">閉じる</button></div></div>
<script>
const board=document.getElementById('board'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),comboEl=document.getElementById('comboNum'),feverBar=document.getElementById('feverBar'),toast=document.getElementById('toast');
const N=7,types=['🐭','🐱','🐶','🐰','🦊','🐻'],bg=['#ff7088','#65b6ff','#87df6d','#ffc25d','#b987ff','#b97755'];
let cells=[],selected=[],drawing=false,score=0,time=60,fever=0,combo=0,playing=false,timer=null,myTsum=localStorage.getItem('myTsum')||'🐭',dropping=false;
const rand=n=>Math.floor(Math.random()*n),pos=i=>({r:Math.floor(i/N),c:i%N});
function xy(i){let p=pos(i);return{x:(p.c+.5)/N*100,y:(p.r+.5)/N*100}}
function place(e,i){let p=xy(i);e.style.left=p.x+'%';e.style.top=p.y+'%';e.dataset.index=i}
function makePiece(type=rand(types.length)){let e=document.createElement('div');e.className='piece';e.textContent=types[type];e.dataset.type=type;e.addEventListener('pointerdown',down);return e}
function build(){board.querySelectorAll('.piece,.line').forEach(e=>e.remove());cells=[];for(let i=0;i<N*N;i++){let e=makePiece();place(e,i);board.appendChild(e);cells[i]=e}}
function adjacent(a,b){let A=pos(a),B=pos(b);return Math.abs(A.r-B.r)<=1&&Math.abs(A.c-B.c)<=1&&(A.r!==B.r||A.c!==B.c)}
function down(ev){if(!playing||dropping||this.classList.contains('bomb'))return;ev.preventDefault();drawing=true;selected=[this];this.classList.add('sel');try{board.setPointerCapture(ev.pointerId)}catch{}drawLine()}
board.addEventListener('pointermove',ev=>{if(!drawing||!selected.length)return;let el=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.piece');if(!el||el.classList.contains('bomb'))return;let last=selected[selected.length-1],a=cells.indexOf(last),b=cells.indexOf(el);if(b<0||selected.includes(el)||!adjacent(a,b)||el.dataset.type!==selected[0].dataset.type)return;selected.push(el);el.classList.add('sel');drawLine()});
board.addEventListener('pointerup',finish);board.addEventListener('pointercancel',finish);
function drawLine(){board.querySelectorAll('.line').forEach(x=>x.remove());for(let i=1;i<selected.length;i++){let a=selected[i-1].getBoundingClientRect(),b=selected[i].getBoundingClientRect(),r=board.getBoundingClientRect(),x1=a.left+a.width/2-r.left,y1=a.top+a.height/2-r.top,x2=b.left+b.width/2-r.left,y2=b.top+b.height/2-r.top,dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy),line=document.createElement('div');line.className='line';line.style.left=x1+'px';line.style.top=y1+'px';line.style.width=l+'px';line.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';board.appendChild(line)}}
function finish(){if(!drawing)return;drawing=false;board.querySelectorAll('.line').forEach(x=>x.remove());let chain=[...selected];selected=[];chain.forEach(e=>e.classList.remove('sel'));if(chain.length<3){combo=0;comboEl.textContent=0;return}combo++;let n=chain.length,gain=n*n*12+(n-3)*25+(combo-1)*10;if(fever>=100)gain*=2;score+=gain;fever=Math.min(100,fever+n*8);update();chain.forEach(e=>e.classList.add('pop'));setTimeout(()=>{chain.forEach(e=>{let i=cells.indexOf(e);if(i>=0){cells[i]=null;e.remove()}});collapse()},110);if(fever>=100)startFever();show(n>=7?'🔥 '+n+' CHAIN!':'✨ '+n+' CHAIN!')}
function makeBombAt(i){if(!cells[i])return;let e=cells[i];e.classList.add('bomb');e.textContent='💣';e.dataset.bomb='1';e.dataset.type='-1';e.addEventListener('click',()=>bomb(cells.indexOf(e)),{once:true})}
function bomb(i){if(!playing||dropping||i<0||!cells[i])return;let p=pos(i),out=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(Math.abs(r-p.r)<=1&&Math.abs(c-p.c)<=1){let e=cells[r*N+c];if(e){out.push(e);cells[r*N+c]=null;e.classList.add('pop')}}score+=out.length*90;combo++;fever=Math.min(100,fever+18);update();show('💣 BOMB!');setTimeout(collapse,120)}
function collapse(){dropping=true;let pending=[];for(let c=0;c<N;c++){let w=N-1;for(let r=N-1;r>=0;r--){let i=r*N+c;if(cells[i]){let t=w*N+c;if(t!==i){cells[t]=cells[i];cells[i]=null;pending.push([cells[t],t])}w--}}for(let r=w;r>=0;r--){let i=r*N+c,e=makePiece();cells[i]=e;board.appendChild(e);e.style.top=(-18-(w-r)*15)+'%';e.style.left=((c+.5)/N*100)+'%';e.classList.add('falling');pending.push([e,i])}}requestAnimationFrame(()=>{pending.forEach(([e,i])=>place(e,i));setTimeout(()=>{dropping=false;cells.forEach(e=>e&&e.classList.remove('falling'))},520)})}
function startFever(){fever=0;time=Math.min(60,time+5);score+=1000;update();show('⭐ FEVER TIME!')}
function update(){scoreEl.textContent=score.toLocaleString();timeEl.textContent=time;comboEl.textContent=combo;feverBar.style.width=fever+'%'}
function show(t){toast.textContent=t;toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show')}
function shuffle(){if(playing&&!dropping)build()}
function useSkill(){if(!playing||dropping||fever<100)return;let all=cells.filter(Boolean),targets=all.filter(e=>e.textContent===myTsum);if(targets.length<3)targets=all.slice(0,8);targets.forEach(e=>{let i=cells.indexOf(e);if(i>=0){cells[i]=null;e.remove()}});score+=targets.length*120;fever=0;update();collapse();show('🌟 '+myTsum+' SKILL!')}
function start(){score=0;time=60;fever=0;combo=0;playing=true;dropping=false;update();build();document.getElementById('startModal').style.display='none';document.getElementById('resultModal').style.display='none';clearInterval(timer);timer=setInterval(()=>{time--;update();if(time<=0)end()},1000)}
function end(){playing=false;dropping=false;clearInterval(timer);let a=JSON.parse(localStorage.getItem('tsumRanks')||'[]');a.push(score);a.sort((x,y)=>y-x);a=a.slice(0,10);localStorage.setItem('tsumRanks',JSON.stringify(a));let rank=a.indexOf(score)+1;document.getElementById('final').textContent='SCORE '+score.toLocaleString();document.getElementById('record').textContent=(rank===1?'🏆 ハイスコア！':'ランキング '+rank+'位');document.getElementById('resultModal').style.display='grid'}
function ranks(){let a=JSON.parse(localStorage.getItem('tsumRanks')||'[]');document.getElementById('rankList').innerHTML=a.length?a.map((x,i)=>'<div class="rank"><b>'+(['🥇','🥈','🥉'][i]||'🏅')+' '+(i+1)+'位</b><span>'+x.toLocaleString()+'</span></div>').join(''):'記録なし'}
document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;document.getElementById('shuffle').onclick=shuffle;document.getElementById('skill').onclick=useSkill;document.getElementById('gacha').onclick=()=>document.getElementById('gachaPanel').style.display='grid';document.getElementById('ranking').onclick=()=>{ranks();document.getElementById('rankPanel').style.display='grid'};document.getElementById('doGacha').onclick=()=>{if(score<500){show('💰 SCORE不足');return}score-=500;myTsum=types[rand(types.length)];localStorage.setItem('myTsum',myTsum);document.getElementById('myIcon').textContent=myTsum;update();show('🎁 GET '+myTsum)};document.getElementById('myIcon').textContent=myTsum;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).style.display='none');
</script>
</body>
</html>
