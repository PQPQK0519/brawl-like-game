<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ツムツム風ゲーム</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Hiragino Kaku Gothic ProN",sans-serif;background:linear-gradient(#73d9ff,#dff8ff 55%,#ffd9f1);color:#54265f;overflow-x:hidden}.game{width:min(100%,720px);margin:auto;padding:10px}.hud{background:#fffffff2;border:3px solid #fff;border-radius:24px;padding:9px;box-shadow:0 7px 22px #54265f33}.top{display:grid;grid-template-columns:1.2fr 1fr 1fr .6fr;align-items:center;text-align:center}.top small{display:block;font-size:10px;font-weight:900;opacity:.6}.top b{font-size:24px}.heart{font-size:25px}.bars{display:grid;gap:5px;margin-top:7px}.bar{height:12px;background:#ddd;border:2px solid #fff;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;transition:width .15s}.fever{background:linear-gradient(90deg,#ffc52e,#ff4da4)}.skill{background:linear-gradient(90deg,#75d9ff,#9a5cff)}.boardbox{margin-top:10px;padding:7px;background:#ffffffaa;border:4px solid white;border-radius:30px;box-shadow:0 10px 25px #54265f44}.board{position:relative;aspect-ratio:1;border-radius:23px;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 10%,#fff,#e9f8ff 70%,#c9e9ff)}.piece{position:absolute;width:13.5%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(25px,7vw,51px);line-height:1;transform:translate(-50%,-50%);filter:drop-shadow(0 5px 3px #0004);user-select:none;cursor:pointer;transition:left .34s cubic-bezier(.18,.8,.25,1),top .34s cubic-bezier(.18,.8,.25,1),transform .1s,opacity .12s}.piece:after{content:"";position:absolute;inset:6%;border:2px solid #fff9;border-radius:50%;box-shadow:inset 0 3px 7px #fff8}.piece.sel{transform:translate(-50%,-50%) scale(1.17);filter:drop-shadow(0 0 9px white)}.piece.pop{opacity:0;transform:translate(-50%,-50%) scale(1.55)}.piece.fall{animation:fall .4s ease-out}@keyframes fall{from{transform:translate(-50%,-180%) scale(.8);opacity:.3}to{transform:translate(-50%,-50%) scale(1);opacity:1}}.bomb{font-size:clamp(29px,8vw,55px)}.line{position:absolute;height:8px;background:#fff9;border-radius:10px;transform-origin:0 50%;pointer-events:none;z-index:5}.toast{position:absolute;left:50%;top:45%;z-index:20;transform:translate(-50%,-50%) scale(.5);font-size:clamp(30px,10vw,70px);font-weight:1000;color:#ff4b9e;text-shadow:0 4px #fff;opacity:0;pointer-events:none;white-space:nowrap}.toast.show{animation:toast .7s ease-out}@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.btn{border:0;border-radius:17px;padding:11px 4px;background:#fff;color:#54265f;font-weight:1000;box-shadow:0 4px 10px #54265f33;cursor:pointer}.btn:active{transform:scale(.95)}.btn[disabled]{opacity:.45}.gold{background:#ffd84d}.sub{display:block;font-size:10px;opacity:.65}.modal,.panel{position:fixed;inset:0;background:#30123db8;z-index:50;display:grid;place-items:center;padding:18px}.panel{display:none;z-index:60}.card{width:min(500px,100%);background:#fffffff5;border:4px solid #fff;border-radius:28px;padding:25px;text-align:center;box-shadow:0 18px 55px #0005}.logo{font-size:46px;font-weight:1000;text-shadow:0 4px #ffd2e8}.start{border:0;border-radius:20px;padding:15px 35px;background:linear-gradient(#ff7cba,#ff4899);color:white;font-size:21px;font-weight:1000;box-shadow:0 6px #c83d78;cursor:pointer}.rank{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid #ddd}.close{width:100%;margin-top:12px}
@media(max-width:500px){.buttons{grid-template-columns:1fr 1fr}.top b{font-size:19px}.game{padding:5px}}
</style>
</head>
<body>
<div class="game">
<div class="hud"><div class="top"><div><small>SCORE</small><b id="score">0</b></div><div><small>TIME</small><b id="time">60</b></div><div><small>COMBO</small><b id="combo">0</b></div><div class="heart">❤️</div></div><div class="bars"><div class="bar"><i id="feverBar" class="fever"></i></div><div class="bar"><i id="skillBar" class="skill"></i></div></div></div>
<div class="boardbox"><div id="board" class="board"><div id="toast" class="toast"></div></div></div>
<div class="buttons"><button class="btn" id="shuffle">🔄<span class="sub">シャッフル</span></button><button class="btn gold" id="skillBtn" disabled>⭐<span class="sub">スキル</span></button><button class="btn" id="gacha">🎁<span class="sub">マイツム</span></button><button class="btn" id="ranking">🏆<span class="sub">ランキング</span></button></div>
</div>
<div id="startModal" class="modal"><div class="card"><div class="logo">🌈 ツムツム</div><h2>同じツムを3個以上つなごう！</h2><p>なぞったツムは消えて、上から新しいツムが落ちてくるよ。<br>長くつなぐほど高得点！</p><button class="start" id="start">ゲームスタート</button></div></div>
<div id="resultModal" class="modal" style="display:none"><div class="card"><div class="logo">🎉 TIME UP!</div><h2 id="final">SCORE 0</h2><p id="record"></p><button class="start" id="again">もう一度遊ぶ</button></div></div>
<div id="gachaPanel" class="panel"><div class="card"><div style="font-size:60px" id="myIcon">🐭</div><h2>🎁 マイツム</h2><p>スコア500でマイツムを変更できます。</p><button class="start" id="doGacha">500でガチャ</button><button class="btn close" data-close="gachaPanel">閉じる</button></div></div>
<div id="rankPanel" class="panel"><div class="card"><h2>🏆 ランキング</h2><div id="rankList"></div><button class="btn close" data-close="rankPanel">閉じる</button></div></div>
<script>
const board=document.getElementById('board'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),comboEl=document.getElementById('combo'),feverBar=document.getElementById('feverBar'),skillBar=document.getElementById('skillBar'),skillBtn=document.getElementById('skillBtn'),toast=document.getElementById('toast');
const N=7,types=['🐭','🐱','🐶','🐰','🦊','🐻'],bg=['#ff7088','#65b6ff','#87df6d','#ffc25d','#b987ff','#b97755'];
let cells=[],selected=[],drawing=false,busy=false,score=0,time=60,combo=0,fever=0,skill=0,playing=false,timer=null,feverUntil=0,myTsum=localStorage.getItem('myTsum')||'🐭';
const rand=n=>Math.floor(Math.random()*n),pos=i=>({r:Math.floor(i/N),c:i%N}),xy=i=>{let p=pos(i);return{x:(p.c+.5)/N*100,y:(p.r+.5)/N*100}};
function place(e,i){let p=xy(i);e.style.left=p.x+'%';e.style.top=p.y+'%';e.dataset.index=i}
function makePiece(type=rand(types.length),fall=false){let e=document.createElement('div');e.className='piece'+(fall?' fall':'');e.textContent=types[type];e.dataset.type=type;e.style.background=bg[type];e.addEventListener('pointerdown',down);return e}
function build(){board.querySelectorAll('.piece,.line').forEach(e=>e.remove());cells=[];for(let i=0;i<N*N;i++){let e=makePiece();place(e,i);board.appendChild(e);cells[i]=e}}
function adjacent(a,b){let A=pos(a),B=pos(b);return Math.max(Math.abs(A.r-B.r),Math.abs(A.c-B.c))===1}
function down(ev){if(!playing||busy||this.classList.contains('bomb'))return;ev.preventDefault();drawing=true;selected=[this];this.classList.add('sel');try{board.setPointerCapture(ev.pointerId)}catch{}drawLine()}
board.addEventListener('pointermove',ev=>{if(!drawing||busy)return;let el=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.piece');if(!el||el.classList.contains('bomb'))return;let last=selected[selected.length-1],a=cells.indexOf(last),b=cells.indexOf(el);if(b<0||selected.includes(el)||!adjacent(a,b)||el.dataset.type!==selected[0].dataset.type)return;selected.push(el);el.classList.add('sel');drawLine()});
board.addEventListener('pointerup',finish);board.addEventListener('pointercancel',finish);
function drawLine(){board.querySelectorAll('.line').forEach(x=>x.remove());for(let i=1;i<selected.length;i++){let a=selected[i-1].getBoundingClientRect(),b=selected[i].getBoundingClientRect(),r=board.getBoundingClientRect(),x1=a.left+a.width/2-r.left,y1=a.top+a.height/2-r.top,x2=b.left+b.width/2-r.left,y2=b.top+b.height/2-r.top,dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy),line=document.createElement('div');line.className='line';line.style.cssText=`left:${x1}px;top:${y1}px;width:${l}px;transform:rotate(${Math.atan2(dy,dx)}rad)`;board.appendChild(line)}}
function finish(){if(!drawing)return;drawing=false;board.querySelectorAll('.line').forEach(x=>x.remove());let chain=[...selected];selected=[];chain.forEach(e=>e.classList.remove('sel'));if(chain.length<3){combo=0;update();return}busy=true;combo++;let n=chain.length,now=Date.now(),inFever=now<feverUntil;let gain=n*n*10+(n-3)*35+(combo-1)*12;if(inFever)gain=Math.floor(gain*2);score+=gain;skill=Math.min(100,skill+n*7);fever=Math.min(100,fever+n*9);if(n>=5)createBomb(chain[Math.floor(n/2)]);chain.forEach(e=>e.classList.add('pop'));update();show(inFever?'⭐ FEVER ×2!':n>=10?'🔥 SUPER '+n+' CHAIN!':n+' CHAIN!');setTimeout(()=>removeChain(chain),150)}
function createBomb(center){let i=cells.indexOf(center);if(i<0)return;center.classList.remove('pop');center.classList.add('bomb');center.textContent='💣';center.dataset.bomb='1';center.dataset.type='-1';center.onclick=()=>bomb(i,center)}
function removeChain(chain){for(let e of chain){if(e.dataset.bomb==='1')continue;let i=cells.indexOf(e);if(i>=0){cells[i]=null;e.remove()}}collapse();busy=false}
function bomb(i,el){if(!playing||busy)return;let actual=cells.indexOf(el);if(actual<0)return;busy=true;let p=pos(actual),out=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(Math.abs(r-p.r)<=1&&Math.abs(c-p.c)<=1){let e=cells[r*N+c];if(e&&e!==el){out.push(e);cells[r*N+c]=null;e.classList.add('pop')}}cells[actual]=null;el.remove();score+=out.length*90;skill=Math.min(100,skill+15);fever=Math.min(100,fever+20);combo++;update();show('💣 BOMB!');setTimeout(()=>{collapse();busy=false},150)}
function collapse(){for(let c=0;c<N;c++){let write=N-1;for(let r=N-1;r>=0;r--){let i=r*N+c,e=cells[i];if(e){let t=write*N+c;if(t!==i){cells[t]=e;cells[i]=null;place(e,t)}write--}}for(let r=write;r>=0;r--){let i=r*N+c,e=makePiece(rand(types.length),true);cells[i]=e;board.appendChild(e);place(e,i)}}}
function update(){scoreEl.textContent=score.toLocaleString();timeEl.textContent=time;comboEl.textContent=combo;feverBar.style.width=fever+'%';skillBar.style.width=skill+'%';skillBtn.disabled=skill<100||!playing}
function show(t){toast.textContent=t;toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show')}
function startFever(){fever=0;feverUntil=Date.now()+7000;show('⭐ FEVER TIME!');update();setTimeout(()=>{if(Date.now()>=feverUntil)update()},7100)}
function useSkill(){if(!playing||skill<100||busy)return;busy=true;let targets=cells.filter(e=>e&&e.dataset.type>=0&&e.textContent===myTsum);if(targets.length<2)targets=cells.filter(e=>e&&e.dataset.type>=0).slice(0,8);targets.forEach(e=>{let i=cells.indexOf(e);if(i>=0){cells[i]=null;e.classList.add('pop')}});score+=targets.length*150;skill=0;combo++;update();show('🌟 '+myTsum+' SKILL!');setTimeout(()=>{targets.forEach(e=>{if(e.parentNode)e.remove()});collapse();busy=false},160)}
function shuffle(){if(!playing||busy)return;let arr=cells.filter(Boolean);arr.sort(()=>Math.random()-.5);arr.forEach((e,i)=>{cells[i]=e;place(e,i)})}
function start(){score=0;time=60;combo=0;fever=0;skill=0;feverUntil=0;playing=true;busy=false;update();build();document.getElementById('startModal').style.display='none';document.getElementById('resultModal').style.display='none';clearInterval(timer);timer=setInterval(()=>{time--;if(Date.now()>=feverUntil){}update();if(time<=0)end()},1000)}
function end(){playing=false;clearInterval(timer);let a=JSON.parse(localStorage.getItem('tsumRanks')||'[]');a.push(score);a.sort((x,y)=>y-x);a=a.slice(0,10);localStorage.setItem('tsumRanks',JSON.stringify(a));document.getElementById('final').textContent='SCORE '+score.toLocaleString();document.getElementById('record').textContent='ランキング '+(a.indexOf(score)+1)+'位';document.getElementById('resultModal').style.display='grid';update()}
function ranks(){let a=JSON.parse(localStorage.getItem('tsumRanks')||'[]');document.getElementById('rankList').innerHTML=a.length?a.map((x,i)=>`<div class="rank"><b>${['🥇','🥈','🥉'][i]||'🏅'} ${i+1}位</b><span>${x.toLocaleString()}</span></div>`).join(''):'記録なし'}
document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;document.getElementById('shuffle').onclick=shuffle;document.getElementById('skillBtn').onclick=useSkill;document.getElementById('gacha').onclick=()=>document.getElementById('gachaPanel').style.display='grid';document.getElementById('ranking').onclick=()=>{ranks();document.getElementById('rankPanel').style.display='grid'};document.getElementById('doGacha').onclick=()=>{if(score<500){show('💰 SCORE不足');return}score-=500;myTsum=types[rand(types.length)];localStorage.setItem('myTsum',myTsum);document.getElementById('myIcon').textContent=myTsum;update();show('🎁 GET '+myTsum)};document.getElementById('myIcon').textContent=myTsum;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).style.display='none');
</script></body></html>
