<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ツムツム風パズル</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:linear-gradient(180deg,#71d9ff,#eafaff 58%,#ffd9ee);color:#4b2858}body{display:flex;justify-content:center}.app{width:min(760px,100%);padding:10px}.hud{background:#fffffff2;border:3px solid #fff;border-radius:25px;padding:10px;box-shadow:0 8px 25px #5b286433}.stats{display:grid;grid-template-columns:1.4fr 1fr 1fr .55fr;gap:4px;text-align:center;align-items:center}.stats small{display:block;font-size:10px;font-weight:900;opacity:.55}.stats b{font-size:24px}.heart{font-size:27px}.meter{height:12px;background:#ddd;border:2px solid #fff;border-radius:99px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;width:0;transition:width .15s}.fever{background:linear-gradient(90deg,#ffd52f,#ff4caa)}.skill{background:linear-gradient(90deg,#61d8ff,#975aff)}.boardWrap{margin-top:10px;padding:7px;border:4px solid white;border-radius:30px;background:#ffffffa8;box-shadow:0 10px 30px #5b286444}.board{position:relative;width:100%;aspect-ratio:1;border-radius:23px;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 10%,#fff,#edfaff 65%,#cceaff)}.piece{position:absolute;width:13.2%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;font-size:clamp(25px,7vw,52px);line-height:1;user-select:none;cursor:pointer;filter:drop-shadow(0 5px 3px #0004);transition:left .25s cubic-bezier(.18,.8,.25,1),top .25s cubic-bezier(.18,.8,.25,1),transform .12s,opacity .14s}.piece:after{content:"";position:absolute;inset:7%;border:2px solid #fff9;border-radius:50%;box-shadow:inset 0 4px 8px #fff8}.piece.sel{transform:translate(-50%,-50%) scale(1.16);filter:drop-shadow(0 0 9px white)}.piece.pop{opacity:0;transform:translate(-50%,-50%) scale(1.55)}.piece.new{animation:drop .3s ease-out}@keyframes drop{from{transform:translate(-50%,-180%) scale(.7);opacity:.2}to{transform:translate(-50%,-50%) scale(1);opacity:1}}.bomb{font-size:clamp(28px,8vw,56px)!important}.line{position:absolute;height:8px;background:#fff9;border-radius:8px;transform-origin:0 50%;pointer-events:none;z-index:5}.toast{position:absolute;left:50%;top:45%;z-index:20;transform:translate(-50%,-50%) scale(.5);font-size:clamp(30px,10vw,70px);font-weight:1000;color:#ff4b9e;text-shadow:0 4px #fff;opacity:0;pointer-events:none;white-space:nowrap}.toast.show{animation:toast .7s ease-out}@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.btn{border:0;border-radius:17px;padding:10px 4px;background:#fff;color:#4b2858;font-weight:1000;box-shadow:0 4px 10px #5b286433;cursor:pointer}.btn:active{transform:scale(.95)}.btn:disabled{opacity:.45;cursor:not-allowed}.gold{background:#ffd84d}.sub{display:block;font-size:10px;opacity:.65}.overlay{position:fixed;inset:0;background:#30123db8;z-index:50;display:grid;place-items:center;padding:18px}.panel{display:none}.card{width:min(500px,100%);background:#fffffff7;border:4px solid white;border-radius:28px;padding:24px;text-align:center;box-shadow:0 18px 55px #0005}.logo{font-size:45px;font-weight:1000;text-shadow:0 4px #ffd2e8}.start{border:0;border-radius:20px;padding:15px 34px;background:linear-gradient(#ff7cba,#ff4899);color:#fff;font-size:21px;font-weight:1000;box-shadow:0 6px #c83d78;cursor:pointer}.rank{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid #ddd}.close{width:100%;margin-top:12px}.help{font-size:13px;opacity:.7}@media(max-width:500px){.buttons{grid-template-columns:1fr 1fr}.stats b{font-size:19px}.app{padding:5px}}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="stats">
      <div><small>SCORE</small><b id="score">0</b></div>
      <div><small>TIME</small><b id="time">60</b></div>
      <div><small>COMBO</small><b id="combo">0</b></div>
      <div class="heart">❤️</div>
    </div>
    <div class="meter"><i id="fever" class="fever"></i></div>
    <div class="meter"><i id="skill" class="skill"></i></div>
  </div>
  <div class="boardWrap"><div id="board" class="board"><div id="toast" class="toast"></div></div></div>
  <div class="buttons">
    <button id="shuffle" class="btn">🔄<span class="sub">シャッフル</span></button>
    <button id="skillBtn" class="btn gold" disabled>⭐<span class="sub">スキル</span></button>
    <button id="myBtn" class="btn">🎁<span class="sub">マイツム</span></button>
    <button id="rankBtn" class="btn">🏆<span class="sub">ランキング</span></button>
  </div>
</div>

<div id="startPanel" class="overlay"><div class="card">
  <div class="logo">🌈 ツムツム</div><h2>同じツムを3個以上つなごう！</h2>
  <p>指・マウスで同じツムをなぞってつなげよう。<br>長くつなぐほど高得点！5個以上でボムが出るよ。</p>
  <p class="help">7×7マス / 60秒 / フィーバー / スキル / ランキング</p>
  <button id="start" class="start">ゲームスタート</button>
</div></div>

<div id="resultPanel" class="overlay" style="display:none"><div class="card">
  <div class="logo">🎉 TIME UP!</div><h2 id="final">SCORE 0</h2><p id="record"></p>
  <button id="again" class="start">もう一度遊ぶ</button>
</div></div>

<div id="myPanel" class="overlay panel"><div class="card">
  <div id="myIcon" style="font-size:65px">🐭</div><h2>🎁 マイツム</h2>
  <p>500点でマイツムを変更できます。</p>
  <button id="gacha" class="start">500でガチャ</button>
  <button class="btn close" data-close="myPanel">閉じる</button>
</div></div>

<div id="rankPanel" class="overlay panel"><div class="card">
  <h2>🏆 ランキング TOP10</h2><div id="rankList"></div>
  <button class="btn close" data-close="rankPanel">閉じる</button>
</div></div>

<script>
const board=document.getElementById('board');
const scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),comboEl=document.getElementById('combo');
const feverEl=document.getElementById('fever'),skillEl=document.getElementById('skill'),skillBtn=document.getElementById('skillBtn'),toast=document.getElementById('toast');
const N=7,types=['🐭','🐱','🐶','🐰','🦊','🐻'],bg=['#ff7189','#63b8ff','#83dc72','#ffc65a','#ae82ff','#b77752'];
let cells=[],selected=[],drawing=false,busy=false,playing=false,score=0,time=60,combo=0,fever=0,skill=0,feverUntil=0,timer=null;
let myTsum=localStorage.getItem('tsum_my')||'🐭';
const rand=n=>Math.floor(Math.random()*n);
const pos=i=>({r:Math.floor(i/N),c:i%N});
const xy=i=>{const p=pos(i);return{x:(p.c+.5)/N*100,y:(p.r+.5)/N*100}};
function place(e,i){const p=xy(i);e.style.left=p.x+'%';e.style.top=p.y+'%';e.dataset.index=i}
function makePiece(t=rand(types.length),fresh=false){const e=document.createElement('div');e.className='piece'+(fresh?' new':'');e.textContent=types[t];e.dataset.type=t;e.addEventListener('pointerdown',onDown);return e}
function build(){board.querySelectorAll('.piece,.line').forEach(e=>e.remove());cells=[];for(let i=0;i<N*N;i++){const e=makePiece();place(e,i);board.appendChild(e);cells[i]=e}}
function adjacent(a,b){const A=pos(a),B=pos(b);return Math.max(Math.abs(A.r-B.r),Math.abs(A.c-B.c))===1}
function onDown(ev){if(!playing||busy||this.dataset.bomb==='1')return;ev.preventDefault();drawing=true;selected=[this];this.classList.add('sel');try{board.setPointerCapture(ev.pointerId)}catch{}drawLines()}
board.addEventListener('pointermove',ev=>{if(!drawing||busy)return;const el=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.piece');if(!el||el.dataset.bomb==='1')return;const last=selected[selected.length-1],a=cells.indexOf(last),b=cells.indexOf(el);if(b<0||selected.includes(el)||!adjacent(a,b)||el.dataset.type!==selected[0].dataset.type)return;selected.push(el);el.classList.add('sel');drawLines()});
board.addEventListener('pointerup',finish);board.addEventListener('pointercancel',finish);
function drawLines(){board.querySelectorAll('.line').forEach(e=>e.remove());const r=board.getBoundingClientRect();for(let i=1;i<selected.length;i++){const a=selected[i-1].getBoundingClientRect(),b=selected[i].getBoundingClientRect(),x1=a.left+a.width/2-r.left,y1=a.top+a.height/2-r.top,x2=b.left+b.width/2-r.left,y2=b.top+b.height/2-r.top,dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy),line=document.createElement('div');line.className='line';line.style.cssText=`left:${x1}px;top:${y1}px;width:${l}px;transform:rotate(${Math.atan2(dy,dx)}rad)`;board.appendChild(line)}}
function finish(){if(!drawing)return;drawing=false;board.querySelectorAll('.line').forEach(e=>e.remove());const chain=[...selected];selected=[];chain.forEach(e=>e.classList.remove('sel'));if(chain.length<3){combo=0;update();return}busy=true;combo++;const n=chain.length,inFever=Date.now()<feverUntil;let gain=n*n*10+(n-3)*35+(combo-1)*12;if(inFever)gain*=2;score+=gain;skill=Math.min(100,skill+n*7);fever=Math.min(100,fever+n*9);chain.forEach(e=>e.classList.add('pop'));if(n>=5){const center=chain[Math.floor(n/2)];setTimeout(()=>makeBomb(center),80)}update();show(inFever?'⭐ FEVER ×2!':n>=10?'🔥 SUPER '+n+' CHAIN!':n+' CHAIN!');setTimeout(()=>removeChain(chain),160)}
function makeBomb(center){const i=cells.indexOf(center);if(i<0||center.dataset.bomb==='1')return;center.classList.remove('pop');center.dataset.bomb='1';center.dataset.type='-1';center.textContent='💣';center.classList.add('bomb');center.addEventListener('pointerdown',()=>explode(i,center),{once:true})}
function removeChain(chain){for(const e of chain){if(e.dataset.bomb==='1')continue;const i=cells.indexOf(e);if(i>=0){cells[i]=null;e.remove()}}collapse();busy=false}
function explode(i,el){if(!playing||busy)return;const actual=cells.indexOf(el);if(actual<0)return;busy=true;const p=pos(actual),out=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(Math.abs(r-p.r)<=1&&Math.abs(c-p.c)<=1){const e=cells[r*N+c];if(e){out.push(e);cells[r*N+c]=null;e.classList.add('pop')}}score+=out.length*90;skill=Math.min(100,skill+18);fever=Math.min(100,fever+20);combo++;update();show('💣 BOMB!');setTimeout(()=>{out.forEach(e=>e.remove());collapse();busy=false},160)}
function collapse(){for(let c=0;c<N;c++){let write=N-1;for(let r=N-1;r>=0;r--){const i=r*N+c,e=cells[i];if(e){const t=write*N+c;if(t!==i){cells[t]=e;cells[i]=null;place(e,t)}write--}}for(let r=write;r>=0;r--){const i=r*N+c,e=makePiece(rand(types.length),true);cells[i]=e;board.appendChild(e);place(e,i)}}}
function update(){scoreEl.textContent=score.toLocaleString();timeEl.textContent=time;comboEl.textContent=combo;feverEl.style.width=fever+'%';skillEl.style.width=skill+'%';skillBtn.disabled=skill<100||!playing}
function show(text){toast.textContent=text;toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show')}
function useSkill(){if(!playing||busy||skill<100)return;busy=true;let targets=cells.filter(e=>e&&e.dataset.type>=0&&e.textContent===myTsum);if(targets.length<3)targets=cells.filter(e=>e&&e.dataset.type>=0).slice(0,10);targets.forEach(e=>{const i=cells.indexOf(e);if(i>=0){cells[i]=null;e.classList.add('pop')}});score+=targets.length*150;skill=0;combo++;update();show('🌟 '+myTsum+' SKILL!');setTimeout(()=>{targets.forEach(e=>e.remove());collapse();busy=false},160)}
function shuffle(){if(!playing||busy)return;const arr=cells.filter(Boolean);for(let i=arr.length-1;i>0;i--){const j=rand(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}arr.forEach((e,i)=>{cells[i]=e;place(e,i)})}
function startGame(){score=0;time=60;combo=0;fever=0;skill=0;feverUntil=0;playing=true;busy=false;build();update();document.getElementById('startPanel').style.display='none';document.getElementById('resultPanel').style.display='none';clearInterval(timer);timer=setInterval(()=>{time--;if(fever>=100){fever=0;feverUntil=Date.now()+7000;show('⭐ FEVER TIME!')}update();if(time<=0)endGame()},1000)}
function endGame(){playing=false;clearInterval(timer);const ranks=JSON.parse(localStorage.getItem('tsum_ranks')||'[]');ranks.push(score);ranks.sort((a,b)=>b-a);const top=ranks.slice(0,10);localStorage.setItem('tsum_ranks',JSON.stringify(top));document.getElementById('final').textContent='SCORE '+score.toLocaleString();document.getElementById('record').textContent='ランキング '+(top.indexOf(score)+1)+'位';document.getElementById('resultPanel').style.display='grid';update()}
function openRanks(){const a=JSON.parse(localStorage.getItem('tsum_ranks')||'[]');document.getElementById('rankList').innerHTML=a.length?a.map((x,i)=>`<div class="rank"><b>${['🥇','🥈','🥉'][i]||'🏅'} ${i+1}位</b><span>${x.toLocaleString()}</span></div>`).join(''):'記録なし';document.getElementById('rankPanel').style.display='grid'}
function gacha(){if(score<500||!playing)return;score-=500;myTsum=types[rand(types.length)];localStorage.setItem('tsum_my',myTsum);document.getElementById('myIcon').textContent=myTsum;show('🎁 '+myTsum+' GET!');update()}
document.getElementById('start').onclick=startGame;document.getElementById('again').onclick=startGame;skillBtn.onclick=useSkill;document.getElementById('shuffle').onclick=shuffle;document.getElementById('rankBtn').onclick=openRanks;document.getElementById('gacha').onclick=gacha;document.getElementById('myBtn').onclick=()=>{document.getElementById('myIcon').textContent=myTsum;document.getElementById('myPanel').style.display='grid'};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).style.display='none');
update();
</script>
</body>
</html>
