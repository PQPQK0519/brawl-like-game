<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ツムツム風パズル</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(#8ed8ff,#f6d6ff);min-height:100vh;display:flex;justify-content:center;color:#45224f}#app{width:min(100%,720px);padding:14px}.top{display:flex;justify-content:space-between;gap:8px;background:#ffffffdd;border-radius:18px;padding:10px 14px;box-shadow:0 5px 18px #704b7a33;font-weight:800}.stat{text-align:center;flex:1}.label{font-size:11px;opacity:.65}.value{font-size:22px}.boardWrap{margin-top:12px;background:#fff8;border:5px solid #fff;border-radius:25px;padding:10px;box-shadow:0 8px 25px #704b7a33}.board{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:18px;background:radial-gradient(circle at 50% 30%,#fff,#e9f5ff);touch-action:none}.tsum{position:absolute;width:11.5%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(20px,6vw,42px);cursor:pointer;user-select:none;transform:translate(-50%,-50%);filter:drop-shadow(0 5px 3px #0003);transition:transform .12s,opacity .12s}.tsum::after{content:'';position:absolute;inset:8%;border-radius:50%;border:2px solid #ffffff88}.tsum.selected{transform:translate(-50%,-50%) scale(1.2);filter:drop-shadow(0 0 8px #fff)}.bottom{display:flex;gap:8px;margin-top:12px}.btn{flex:1;border:0;border-radius:14px;padding:12px;background:#fff;color:#45224f;font-weight:900;box-shadow:0 4px 12px #704b7a33;cursor:pointer}.btn:active{transform:scale(.96)}.skill{background:#ffd65a}.modal{position:fixed;inset:0;background:#32143d88;display:grid;place-items:center;padding:20px}.card{background:#fff;border-radius:25px;padding:28px;text-align:center;max-width:480px;width:100%;box-shadow:0 15px 50px #0004}.start{border:0;border-radius:16px;background:#ff6fae;color:white;font-size:20px;font-weight:900;padding:15px 30px;cursor:pointer}.combo{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-weight:1000;font-size:clamp(28px,9vw,65px);color:#ff4d9d;text-shadow:0 4px white;pointer-events:none;opacity:0}.combo.show{animation:pop .65s}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}30%,70%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
</style></head><body><div id="app"><div class="top"><div class="stat"><div class="label">SCORE</div><div class="value" id="score">0</div></div><div class="stat"><div class="label">TIME</div><div class="value" id="time">60</div></div><div class="stat"><div class="label">FEVER</div><div class="value" id="fever">0%</div></div></div><div class="boardWrap"><div id="board" class="board"><div id="combo" class="combo">COMBO!</div></div></div><div class="bottom"><button class="btn" id="shuffle">🔄 シャッフル</button><button class="btn skill" id="skill">⭐ スキル</button><button class="btn" id="restart">↻ リスタート</button></div></div><div id="menu" class="modal"><div class="card"><h1>🌈 ツムツム風</h1><p>同じツムを<strong>3個以上</strong>つなげよう！<br>長くつなぐほど高得点。フィーバーもあるよ！</p><button class="start" id="start">ゲームスタート</button></div></div><div id="result" class="modal" style="display:none"><div class="card"><h1>🎉 TIME UP!</h1><h2 id="final">SCORE 0</h2><button class="start" id="again">もう一度遊ぶ</button></div></div>
<script>
const board=document.querySelector('#board'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),feverEl=document.querySelector('#fever'),comboEl=document.querySelector('#combo');
const types=['🐭','🐱','🐶','🐰','🦊'];let cells=[],selected=[],score=0,time=60,fever=0,playing=false,timer;
const colors=['#ff6b81','#62b0ff','#8bdc65','#ffbf5b','#b987ff'];
function rnd(n){return Math.floor(Math.random()*n)}
function makeBoard(){cells=[];board.querySelectorAll('.tsum').forEach(x=>x.remove());for(let i=0;i<49;i++){const t=rnd(types.length),e=document.createElement('div');e.className='tsum';e.textContent=types[t];e.dataset.type=t;let col=i%7,row=Math.floor(i/7);e.style.left=((col+.5)/7*100)+'%';e.style.top=((row+.5)/7*100)+'%';e.style.background=colors[t];e.addEventListener('pointerdown',ev=>startSelect(e,ev));e.addEventListener('pointerenter',()=>extendSelect(e));board.appendChild(e);cells.push(e)}}
function startSelect(e,ev){if(!playing)return;ev.preventDefault();selected=[e];e.classList.add('selected');try{board.setPointerCapture(ev.pointerId)}catch{}}
function extendSelect(e){if(!playing||!selected.length||selected.includes(e))return;const last=selected[selected.length-1],a=cells.indexOf(last),b=cells.indexOf(e),ar=Math.floor(a/7),ac=a%7,br=Math.floor(b/7),bc=b%7;if(Math.abs(ar-br)<=1&&Math.abs(ac-bc)<=1&&Number(e.dataset.type)===Number(selected[0].dataset.type)){selected.push(e);e.classList.add('selected')}}
board.addEventListener('pointerup',finishSelect);board.addEventListener('pointercancel',finishSelect);
function finishSelect(){if(!selected.length)return;const n=selected.length;selected.forEach(e=>e.classList.remove('selected'));if(n>=3){const gain=n*n*10;score+=gain;fever=Math.min(100,fever+n*6);scoreEl.textContent=score.toLocaleString();feverEl.textContent=fever+'%';comboEl.textContent=n>=7?'🔥 '+n+' CHAIN!':'✨ '+n+' CHAIN!';comboEl.classList.remove('show');void comboEl.offsetWidth;comboEl.classList.add('show');selected.forEach(e=>{e.remove();const i=cells.indexOf(e);if(i>=0)cells[i]=null});fillEmpty();if(fever>=100)startFever()}selected=[]}
function fillEmpty(){for(let i=0;i<49;i++){if(!cells[i]){const t=rnd(types.length),e=document.createElement('div');e.className='tsum';e.textContent=types[t];e.dataset.type=t;e.style.background=colors[t];let col=i%7,row=Math.floor(i/7);e.style.left=((col+.5)/7*100)+'%';e.style.top=((row+.5)/7*100)+'%';e.addEventListener('pointerdown',ev=>startSelect(e,ev));e.addEventListener('pointerenter',()=>extendSelect(e));board.appendChild(e);cells[i]=e}}}
function startFever(){time=Math.min(time+5,60);fever=0;feverEl.textContent='0%';score+=500;scoreEl.textContent=score.toLocaleString();comboEl.textContent='⭐ FEVER!';comboEl.classList.remove('show');void comboEl.offsetWidth;comboEl.classList.add('show')}
function shuffle(){if(playing)makeBoard()}
function skill(){if(!playing||score<500)return;score-=500;scoreEl.textContent=score.toLocaleString();[...board.querySelectorAll('.tsum')].slice(0,10).forEach(e=>{const i=cells.indexOf(e);if(i>=0)cells[i]=null;e.remove()});fillEmpty();comboEl.textContent='💥 SKILL!';comboEl.classList.remove('show');void comboEl.offsetWidth;comboEl.classList.add('show')}
function start(){score=0;time=60;fever=0;playing=true;scoreEl.textContent='0';timeEl.textContent='60';feverEl.textContent='0%';makeBoard();document.querySelector('#menu').style.display='none';document.querySelector('#result').style.display='none';clearInterval(timer);timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)end()},1000)}
function end(){playing=false;clearInterval(timer);document.querySelector('#final').textContent='SCORE '+score.toLocaleString();document.querySelector('#result').style.display='grid'}
document.querySelector('#start').onclick=start;document.querySelector('#again').onclick=start;document.querySelector('#restart').onclick=start;document.querySelector('#shuffle').onclick=shuffle;document.querySelector('#skill').onclick=skill;
</script></body></html>
