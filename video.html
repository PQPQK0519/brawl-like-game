<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎬 ツムツム 動画メーカー</title><style>body{margin:0;background:linear-gradient(135deg,#71d9ff,#ffd9ee);font-family:system-ui,sans-serif;color:#4b2858;text-align:center}header{padding:14px;background:#ffffffdd;position:sticky;top:0;z-index:5;box-shadow:0 3px 15px #0002}h1{margin:4px;font-size:24px}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px}.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:900;font-size:15px;cursor:pointer;background:#fff;box-shadow:0 4px 12px #0002}.start{background:#ff4c9e;color:#fff}.stop{background:#e33;color:#fff}.btn:disabled{opacity:.45}.status{font-weight:900}.wrap{width:min(760px,96vw);height:calc(100vh - 120px);margin:auto;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 10px 35px #0003}.wrap iframe{width:100%;height:100%;border:0}#hint{font-size:12px;opacity:.75}</style></head><body><header><h1>🎬 ツムツム 動画メーカー</h1><div class="controls"><button class="btn start" id="start">🔴 動画を録画</button><button class="btn stop" id="stop" disabled>⏹️ 録画停止・保存</button><button class="btn" id="open">🎮 ゲームを別タブで開く</button></div><div class="status" id="status">録画していません</div><div id="hint">録画開始後、共有画面で「このタブ」を選ぶとゲームプレイを動画にできます。</div></header><div class="wrap"><iframe id="game" src="tsumtsum.html"></iframe></div><script>let rec=null,chunks=[];const start=document.getElementById('start'),stop=document.getElementById('stop'),status=document.getElementById('status'),frame=document.getElementById('game');function supported(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia&&window.MediaRecorder)}async function begin(){if(!supported()){status.textContent='❌ このブラウザは画面録画に対応していません';return}try{const stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:60},audio:false});chunks=[];rec=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm'});rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=save;stream.getVideoTracks()[0].onended=()=>{if(rec&&rec.state==='recording')rec.stop()};rec.start(250);start.disabled=true;stop.disabled=false;status.textContent='🔴 録画中…ゲームをプレイしよう！'}catch(e){status.textContent='録画をキャンセルしました'}}function end(){if(rec&&rec.state==='recording')rec.stop()}function save(){const blob=new Blob(chunks,{type:'video/webm'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tsumtsum-game-'+new Date().toISOString().replace(/[:.]/g,'-')+'.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);start.disabled=false;stop.disabled=true;status.textContent='✅ 動画を保存しました！'}start.onclick=begin;stop.onclick=end;document.getElementById('open').onclick=()=>window.open('tsumtsum.html','_blank');</script></body></html>
