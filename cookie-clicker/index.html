<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cookie Clicker - Fever 7777</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#fff1c7,#f5c97b);color:#4a2a16;min-height:100vh}header{text-align:center;padding:20px 10px;background:#7b3f1d;color:#fff;box-shadow:0 4px 15px #0003}header h1{margin:0;font-size:clamp(28px,5vw,46px)}header p{margin:6px 0;opacity:.9}.wrap{max-width:1150px;margin:auto;padding:18px;display:grid;grid-template-columns:1fr 1.25fr;gap:18px}.panel{background:#fff8e8ef;border:3px solid #8d552f;border-radius:22px;padding:18px;box-shadow:0 8px 25px #63350b22}.count{text-align:center;font-size:clamp(24px,4vw,40px);font-weight:900}.per{display:block;font-size:15px;color:#8a5b38}.cookie-area{display:grid;place-items:center;min-height:460px}.cookie{width:min(320px,70vw);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 35% 30%,#e9a65a,#a94e18 65%,#74300f);box-shadow:inset -20px -25px 30px #5c210d55,0 18px 30px #5b2b0b44;position:relative;transition:.08s}.cookie:active{transform:scale(.94)}.chip{position:absolute;width:28px;height:35px;background:#5b2b18;border-radius:45%}.c1{left:24%;top:25%}.c2{left:55%;top:18%}.c3{left:68%;top:48%}.c4{left:36%;top:57%}.c5{left:18%;top:67%}.c6{left:50%;top:75%}.golden{position:fixed;z-index:20;width:82px;height:82px;border-radius:50%;border:5px solid #fff59d;background:radial-gradient(circle at 35% 30%,#fffbd0,#ffd21c 45%,#f08b00);box-shadow:0 0 28px #ffd21c,0 0 60px #fff3a8;cursor:pointer;animation:pulse .7s infinite alternate}.golden span{font-size:35px}.fever{position:fixed;inset:0;background:#ffcf0088;z-index:15;pointer-events:none;display:grid;place-items:center;animation:bg .4s infinite alternate}.fever h2{font-size:clamp(42px,9vw,100px);color:#fff;text-shadow:0 5px 0 #a74400,0 0 30px #fff;font-weight:1000;transform:rotate(-5deg)}@keyframes pulse{to{transform:scale(1.12) rotate(8deg)}}@keyframes bg{to{background:#ff7b0080}}.float{position:fixed;pointer-events:none;font-size:28px;font-weight:900;color:#7b3f1d;animation:up .8s ease-out forwards;z-index:30}@keyframes up{to{transform:translateY(-90px);opacity:0}}.shop{display:flex;flex-direction:column;gap:9px}.upgrade{display:flex;align-items:center;gap:12px;width:100%;padding:13px;border:2px solid #c58b58;border-radius:14px;background:#fff;cursor:pointer;text-align:left;color:#4a2a16}.upgrade:hover:not(:disabled){background:#fff1d8}.upgrade:disabled{opacity:.48;cursor:not-allowed}.icon{font-size:32px;width:45px;text-align:center}.info{flex:1}.price{font-weight:800;color:#9a4c1c}.owned{font-size:12px;color:#8b6a52}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.tab,.action{border:0;border-radius:10px;padding:9px 12px;background:#e6c89f;color:#4a2a16;cursor:pointer;font-weight:700}.tab.active{background:#8d552f;color:#fff}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.stat{padding:9px;background:#f4dfbe;border-radius:12px;text-align:center}.achievement{padding:9px;border-radius:10px;margin:6px 0;background:#ead9bd;opacity:.55}.achievement.done{opacity:1;background:#ffe18a}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.reset{background:#8d552f;color:#fff}.small{font-size:12px;color:#76563e}.hidden{display:none}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:50;background:#4a2a16;color:#fff;padding:12px 18px;border-radius:14px;box-shadow:0 5px 20px #0004}@media(max-width:760px){.wrap{grid-template-columns:1fr}.cookie-area{min-height:390px}}
</style>
</head>
<body>
<header><h1>🍪 Cookie Clicker</h1><p>ゴールデンクッキーをクリックして<strong>フィーバー7777倍</strong>を発動！</p></header>
<main class="wrap">
<section class="panel cookie-area"><div><div class="count"><span id="cookies">0</span> クッキー<span class="per">毎秒 <span id="cps">0</span> 個　｜　転生Lv <span id="prestige">0</span></span></div><button class="cookie" id="cookie"><i class="chip c1"></i><i class="chip c2"></i><i class="chip c3"></i><i class="chip c4"></i><i class="chip c5"></i><i class="chip c6"></i></button><div id="feverText" class="small" style="text-align:center"></div></div></section>
<section class="panel"><div class="tabs"><button class="tab active" data-tab="shop">🛒 お店</button><button class="tab" data-tab="upgrades">✨ 強化</button><button class="tab" data-tab="achievements">🏆 実績</button><button class="tab" data-tab="stats">📊 統計</button></div>
<div id="shop" class="tabbody"></div><div id="upgrades" class="tabbody hidden"></div><div id="achievements" class="tabbody hidden"></div><div id="stats" class="tabbody hidden"></div>
<div class="controls"><button class="action" id="export">📤 セーブ書き出し</button><button class="action" id="import">📥 セーブ読み込み</button><button class="action reset" id="reset">🗑 リセット</button></div>
</section></main>
<script>
const items=[['cursor','👆','カーソル','自動クリック',15,.1],['grandma','👵','おばあちゃん','クッキーを焼く',100,1],['farm','🌾','クッキーファーム','畑で生産',500,5],['factory','🏭','クッキー工場','大量生産',2500,25],['lab','🧪','クッキー研究所','科学で生産',12000,120],['portal','🌀','クッキーポータル','異世界から召喚',70000,650],['time','⏰','時空マシン','時間をクッキーに',500000,4000]];
const boosts=[['click','🍪','クリック強化','クリック獲得量+2',100,2],['cps','⚡','生産強化','毎秒生産量×1.5',1000,1.5],['gold','🌟','黄金の運','ゴールデンクッキー出現率アップ',5000,1]];
const ach=[['first','初クリック','クッキーを1回クリック'],['hundred','100個','100クッキー生産'],['thousand','1000個','1,000クッキー生産'],['tenk','1万個','10,000クッキー生産'],['million','100万個','1,000,000クッキー生産'],['golden','黄金の幸運','ゴールデンクッキーをクリック'],['fever','7777！','7777倍フィーバーを発動'],['factory','工場長','工場を10個所有'],['rich','大富豪','1億クッキー生産'],['prestige','転生者','転生する']];
let save=JSON.parse(localStorage.getItem('cookie-clicker-save')||'null')||{cookies:0,total:0,clicks:0,owned:{},upgrades:{},ach:{},golden:0,fevers:0,prestige:0,last:Date.now()};items.forEach(x=>save.owned[x[0]]??=0);boosts.forEach(x=>save.upgrades[x[0]]??=0);
const $=id=>document.getElementById(id);const fmt=n=>n<1000?Math.floor(n*10)/10:n.toLocaleString('ja-JP',{maximumFractionDigits:1});
function cps(){let v=items.reduce((s,x)=>s+(save.owned[x[0]]||0)*x[5],0);v*=Math.pow(1.5,save.upgrades.cps||0);v*=1+save.prestige*.1;return v}
function clickPower(){return 1+(save.upgrades.click||0)*2}
function price(x){return Math.floor(x[4]*Math.pow(1.15,save.owned[x[0]]||0))}
function render(){ $('cookies').textContent=fmt(save.cookies);$('cps').textContent=fmt(cps());$('prestige').textContent=save.prestige;$('feverText').textContent=fever>0?'🔥 7777倍フィーバー中！ 残り '+Math.ceil(fever/1000)+'秒':'';renderShop();renderUpgrades();renderAchievements();renderStats()}
function renderShop(){$('shop').innerHTML=items.map(x=>{let p=price(x),o=save.owned[x[0]]||0;return `<button class="upgrade" data-id="${x[0]}" ${save.cookies<p?'disabled':''}><span class="icon">${x[1]}</span><span class="info"><b>${x[2]}</b><br><small>${x[3]}（+${x[5]}/秒）</small><br><span class="price">🍪 ${p.toLocaleString()}</span> <span class="owned">所持 ${o}</span></span></button>`}).join('')}
function renderUpgrades(){$('upgrades').innerHTML=boosts.map(x=>{let o=save.upgrades[x[0]]||0,p=x[4]*Math.pow(4,o);return `<button class="upgrade" data-up="${x[0]}" ${save.cookies<p?'disabled':''}><span class="icon">${x[1]}</span><span class="info"><b>${x[2]}</b><br><small>${x[3]}（Lv${o}）</small><br><span class="price">🍪 ${p.toLocaleString()}</span></span></button>`}).join('')+'<hr><b>🌟 転生</b><p class="small">10億クッキー以上で転生。所持クッキーは0になるが、毎秒生産が永久に+10%。</p><button class="action" id="prestigeBtn" '+(save.total<1e9?'disabled':'')+'>🌟 転生する</button>'}
function renderAchievements(){let map={first:save.clicks>=1,hundred:save.total>=100,thousand:save.total>=1000,tenk:save.total>=1e4,million:save.total>=1e6,golden:save.golden>=1,fever:save.fevers>=1,factory:save.owned.factory>=10,rich:save.total>=1e8,prestige:save.prestige>=1};$('achievements').innerHTML=ach.map((a,i)=>{let d=map[a[0]];if(d&&!save.ach[a[0]]){save.ach[a[0]]=1;toast('🏆 実績解除：'+a[1])}return `<div class="achievement ${d?'done':''}">${d?'🏆':'🔒'} <b>${a[1]}</b> — ${a[2]}</div>`}).join('')}
function renderStats(){$('stats').innerHTML=`<div class="stats"><div class="stat">総クリック<br><b>${save.clicks.toLocaleString()}</b></div><div class="stat">総生産<br><b>${fmt(save.total)}</b></div><div class="stat">黄金<br><b>${save.golden}</b></div><div class="stat">フィーバー<br><b>${save.fevers}</b></div></div><p class="small">現在のクリック：+${fmt(clickPower())}　｜　フィーバー倍率：7777倍</p>`}
function add(n,x,y,manual=false){save.cookies+=n;save.total+=n;if(manual){save.clicks++;float(x,y,'+'+fmt(n))}render()}
function float(x,y,t){let e=document.createElement('div');e.className='float';e.textContent=t;e.style.left=x+'px';e.style.top=y+'px';document.body.append(e);setTimeout(()=>e.remove(),800)}
$('cookie').onclick=e=>add(clickPower()*(fever>0?7777:1),e.clientX,e.clientY,true);
$('shop').onclick=e=>{let b=e.target.closest('.upgrade');if(!b)return;let x=items.find(i=>i[0]===b.dataset.id),p=price(x);if(save.cookies>=p){save.cookies-=p;save.owned[x[0]]++;render();persist()}};
$('upgrades').onclick=e=>{let b=e.target.closest('[data-up]');if(b){let x=boosts.find(i=>i[0]===b.dataset.up),p=x[4]*Math.pow(4,save.upgrades[x[0]]||0);if(save.cookies>=p){save.cookies-=p;save.upgrades[x[0]]++;render();persist()}}if(e.target.id==='prestigeBtn'&&save.total>=1e9){save.prestige++;save.cookies=0;save.owned={};items.forEach(x=>save.owned[x[0]]=0);save.upgrades={click:0,cps:0,gold:0};save.fevers++;toast('🌟 転生成功！永久+10%');render();persist()}};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabbody').forEach(x=>x.classList.add('hidden'));t.classList.add('active');$(t.dataset.tab).classList.remove('hidden')});
let goldenTimer,fever=0;
function spawnGolden(){if(document.querySelector('.golden'))return;let g=document.createElement('button');g.className='golden';g.style.left=(8+Math.random()*78)+'vw';g.style.top=(15+Math.random()*65)+'vh';g.innerHTML='<span>🍪</span>';document.body.append(g);goldenTimer=setTimeout(()=>g.remove(),12000);g.onclick=()=>{clearTimeout(goldenTimer);g.remove();save.golden++;fever=10000;save.fevers++;toast('✨ 7777倍フィーバー開始！10秒間クッキー7777倍！');render();persist()}}
function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}
setInterval(()=>{if(Math.random()<0.018+save.upgrades.gold*.006)spawnGolden()},1000);
setInterval(()=>{if(fever>0){fever-=100;document.body.classList.add('x');if(!document.querySelector('.fever')){let e=document.createElement('div');e.className='fever';e.innerHTML='<h2>🔥 FEVER ×7777 🔥</h2>';document.body.append(e)}if(fever<=0){document.querySelector('.fever')?.remove();toast('フィーバー終了！')}}else document.querySelector('.fever')?.remove();let n=cps()/10*(fever>0?7777:1);if(n)add(n);render()},100);
$('export').onclick=()=>{let code=btoa(unescape(encodeURIComponent(JSON.stringify(save))));prompt('このセーブコードをコピーしてください',code)};
$('import').onclick=()=>{let code=prompt('セーブコードを貼り付けてください');if(code){try{save=JSON.parse(decodeURIComponent(escape(atob(code))));items.forEach(x=>save.owned[x[0]]??=0);boosts.forEach(x=>save.upgrades[x[0]]??=0);persist();render();toast('📥 セーブを読み込みました')}catch{alert('セーブコードが正しくありません')}}};
$('reset').onclick=()=>{if(confirm('本当に全部リセットしますか？')){localStorage.removeItem('cookie-clicker-save');location.reload()}};
function persist(){save.last=Date.now();localStorage.setItem('cookie-clicker-save',JSON.stringify(save))}setInterval(persist,2000);render();
</script></body></html>
