<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ブロスタ風 ガチャチャレンジ</title>
<style>
:root{--ink:#18213a;--blue:#168cf0;--gold:#ffd84d;--pink:#ff4d8d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:white;background:radial-gradient(circle at 50% 0,#4e8cff 0,#253ca3 43%,#111a45 100%);min-height:100vh}
.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-weight:1000;font-size:clamp(24px,4vw,40px);letter-spacing:-1px;text-shadow:0 4px 0 #16235a,0 7px 10px #1118}.logo span{color:#ffe45b}
.pill{background:#14265c;border:2px solid #ffffff35;border-radius:16px;padding:10px 15px;font-weight:900;box-shadow:0 4px 0 #0b153e}
.hero{margin:22px 0 16px;text-align:center;padding:22px 12px 18px;border-radius:26px;border:3px solid #ffffff55;background:linear-gradient(145deg,#4bd5ff,#2476ed 50%,#6644dd);box-shadow:0 8px 0 #111d58, inset 0 2px 0 #fff7;position:relative;overflow:hidden}
.hero:before,.hero:after{content:"✦";position:absolute;font-size:70px;color:#fff5;top:5px}.hero:before{left:8%}.hero:after{right:8%}
.hero h1{margin:0;font-size:clamp(25px,5vw,42px);font-weight:1000;text-shadow:0 4px #173b93}.hero p{margin:8px 0 0;font-weight:750}
.stats{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}.stat{background:#101e54aa;border-radius:12px;padding:8px 12px;font-weight:850}
.panel{background:#f5f7ff;color:var(--ink);border:3px solid #fff;border-radius:22px;padding:17px;box-shadow:0 7px 0 #111d58;margin:16px 0}
.panel h2{margin:0 0 12px;font-size:21px}.rarities{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.rarity{padding:9px 3px;text-align:center;border-radius:12px;color:white;font-size:12px;font-weight:900;text-shadow:0 1px 3px #0005}.rarity b{display:block;font-size:18px}
.common{background:#8c9baa}.rare{background:#22a967}.epic{background:#9b55e8}.mythic{background:#ed4e8b}.legend{background:linear-gradient(135deg,#ffb52e,#ff563e)}
.crates{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.crate{border:0;border-radius:18px;padding:14px 8px 13px;cursor:pointer;color:white;font-weight:900;box-shadow:0 6px 0 #0003;transition:transform .12s;min-width:0}.crate:hover{transform:translateY(-3px)}.crate:active{transform:translateY(2px);box-shadow:0 2px 0 #0003}.crate .emoji{display:block;font-size:clamp(34px,7vw,55px);filter:drop-shadow(0 4px 0 #0002)}.crate .name{display:block;font-size:17px;margin:5px 0}.crate small{display:block;font-size:12px;opacity:.95}.green{background:linear-gradient(#41d987,#15975c)}.purple{background:linear-gradient(#bd72ff,#7434cf)}.orange{background:linear-gradient(#ffcf53,#ed7624)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.btn{border:0;border-radius:13px;padding:11px 15px;font-weight:900;cursor:pointer;background:#182958;color:white;box-shadow:0 4px 0 #0b153e}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.yellow{background:#ffda4d;color:#35254b;box-shadow:0 4px 0 #c18a22}
.result{display:none;text-align:center;border-radius:18px;padding:18px;margin-top:14px;background:linear-gradient(145deg,#182b68,#304aa5);color:white;border:3px solid #fff8;animation:pop .3s ease}.result.show{display:block}.result .big{font-size:74px;line-height:1.2}.result h3{font-size:28px;margin:6px}.result p{margin:5px}.result .rarityTag{display:inline-block;padding:5px 13px;border-radius:30px;font-weight:950}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.collection{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:9px}.fighter{border-radius:14px;background:white;border:2px solid #dfe5f5;padding:10px;text-align:center;position:relative}.fighter .face{font-size:36px}.fighter strong{display:block;font-size:14px}.fighter small{color:#5b6680}.fighter .count{position:absolute;right:6px;top:5px;background:#182958;color:white;border-radius:20px;padding:2px 6px;font-size:11px;font-weight:900}
.empty{color:#69758e;text-align:center;padding:20px 4px}.footer{text-align:center;color:#e3e9ffb8;font-size:12px;padding:15px}
@media(max-width:520px){.wrap{padding:12px}.panel{padding:13px}.crates{gap:7px}.crate{padding:10px 4px}.crate .name{font-size:14px}.crate small{font-size:10px}.rarities{gap:4px}.rarity{font-size:10px}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="logo">⭐ BRAWL <span>GACHA!</span></div><div class="pill">🪙 コイン <span id="coins">500</span></div><div class="pill">💎 ジェム <span id="gems">10</span></div></header>
<section class="hero"><h1>最強ファイターをゲット！</h1><p>ガチャを引いて、キミだけのチームを作ろう！</p><div class="stats"><div class="stat">👊 所持ファイター <span id="owned">0</span>/18</div><div class="stat">🎟️ ガチャ回数 <span id="pulls">0</span></div><div class="stat">✨ 天井まで <span id="pity">20</span> 回</div></div></section>
<section class="panel"><h2>🎯 レアリティ</h2><div class="rarities"><div class="rarity common"><b>⚪</b>ノーマル</div><div class="rarity rare"><b>🟢</b>レア</div><div class="rarity epic"><b>🟣</b>エピック</div><div class="rarity mythic"><b>💗</b>ミシック</div><div class="rarity legend"><b>🟡</b>レジェンド</div></div></section>
<section class="panel"><h2>🎁 ガチャを選ぼう</h2><div class="crates">
<button class="crate green" id="basic"><span class="emoji">📦</span><span class="name">ノーマル箱</span><small>🪙 100コイン</small></button>
<button class="crate purple" id="super"><span class="emoji">🎁</span><span class="name">スーパー箱</span><small>💎 3ジェム</small></button>
<button class="crate orange" id="mega"><span class="emoji">💎</span><span class="name">メガ箱</span><small>🪙 400コイン</small></button>
</div><div class="actions"><button class="btn yellow" id="ten">🔥 10連ガチャ（900コイン）</button><button class="btn" id="daily">🎁 無料ボーナスを受け取る</button></div>
<div class="result" id="result" aria-live="polite"><div class="big" id="resultFace">🎉</div><div id="resultTag" class="rarityTag">レア！</div><h3 id="resultName">ファイター名</h3><p id="resultDesc">説明</p><p id="resultExtra"></p><div class="actions" style="justify-content:center"><button class="btn yellow" id="again">もう一回！</button></div></div></section>
<section class="panel"><h2>🏆 ファイター図鑑</h2><p style="margin-top:-4px;color:#65708b;font-size:13px">同じファイターが出るとパワーアップ！ 集めてコンプリートしよう。</p><div id="collection" class="collection"><div class="empty">ガチャを引いてファイターを集めよう！</div></div><div class="actions"><button class="btn" id="reset">データをリセット</button></div></section>
<div class="footer">ファン制作のオリジナルガチャゲームです。公式のブロスタとは関係ありません。</div>
</main>
<script>
const fighters=[
{name:"ボルト",face:"🤖",rarity:"ノーマル",desc:"電撃ショットが得意なロボット。",color:"#8c9baa",weight:38},
{name:"ニンジャ",face:"🥷",rarity:"ノーマル",desc:"すばやい動きで敵を翻弄！",color:"#8c9baa",weight:35},
{name:"ロッキー",face:"🥊",rarity:"ノーマル",desc:"パワフルなパンチで勝負！",color:"#8c9baa",weight:32},
{name:"ミミ",face:"🐱",rarity:"ノーマル",desc:"かわいい見た目でも実力派。",color:"#8c9baa",weight:30},
{name:"パイロ",face:"🔥",rarity:"ノーマル",desc:"炎を操る熱血ファイター。",color:"#8c9baa",weight:28},
{name:"スパーク",face:"⚡",rarity:"レア",desc:"雷の力で一気に攻める！",color:"#22a967",weight:20},
{name:"ジェット",face:"🚀",rarity:"レア",desc:"ロケットのように戦場を駆ける。",color:"#22a967",weight:18},
{name:"グミ",face:"🍬",rarity:"レア",desc:"不思議な弾で相手をびっくり！",color:"#22a967",weight:17},
{name:"シャーク",face:"🦈",rarity:"レア",desc:"水辺の戦いなら負け知らず。",color:"#22a967",weight:16},
{name:"メカウルフ",face:"🐺",rarity:"エピック",desc:"鋼の牙を持つサイボーグ。",color:"#9b55e8",weight:10},
{name:"マジシャン",face:"🪄",rarity:"エピック",desc:"華麗な魔法で戦況を変える。",color:"#9b55e8",weight:9},
{name:"アイス",face:"🧊",rarity:"エピック",desc:"氷の技で相手を凍らせる。",color:"#9b55e8",weight:8},
{name:"フェニックス",face:"🦅",rarity:"ミシック",desc:"不死鳥の力を秘めた伝説級。",color:"#ed4e8b",weight:5},
{name:"シャドウ",face:"👤",rarity:"ミシック",desc:"影から現れる謎のファイター。",color:"#ed4e8b",weight:4},
{name:"ドラゴン",face:"🐉",rarity:"ミシック",desc:"圧倒的なドラゴンパワー！",color:"#ed4e8b",weight:3},
{name:"キング",face:"👑",rarity:"レジェンド",desc:"王者の風格を持つ最強候補。",color:"#ff9e24",weight:2},
{name:"ギャラクシー",face:"🌌",rarity:"レジェンド",desc:"宇宙のエネルギーを操る。",color:"#ff9e24",weight:1.5},
{name:"ゴールデンベア",face:"🐻",rarity:"レジェンド",desc:"めったに出会えない黄金の王者！",color:"#ff9e24",weight:1}
];
const rarityColor={"ノーマル":"#8c9baa","レア":"#22a967","エピック":"#9b55e8","ミシック":"#ed4e8b","レジェンド":"#ff9e24"};
let state={coins:500,gems:10,pulls:0,pity:20,owned:{},daily:false};
try{const saved=localStorage.getItem("brawlGachaSave");if(saved)state={...state,...JSON.parse(saved)}}catch(e){}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem("brawlGachaSave",JSON.stringify(state))}catch(e){}render()}
function render(){
$("coins").textContent=state.coins;$("gems").textContent=state.gems;$("pulls").textContent=state.pulls;
$("pity").textContent=state.pity;$("owned").textContent=Object.keys(state.owned).length;
$("basic").disabled=state.coins<100;$("super").disabled=state.gems<3;$("mega").disabled=state.coins<400;$("ten").disabled=state.coins<900;
$("daily").disabled=state.daily;$("daily").textContent=state.daily?"✅ 今日のボーナス受取済み":"🎁 無料ボーナスを受け取る";
const list=$("collection");list.innerHTML="";
const got=fighters.filter(f=>state.owned[f.name]);
if(!got.length){list.innerHTML='<div class="empty">ガチャを引いてファイターを集めよう！</div>';return}
got.sort((a,b)=>fighters.indexOf(b)-fighters.indexOf(a)).forEach(f=>{const d=document.createElement("div");d.className="fighter";d.style.borderColor=f.color;d.innerHTML='<span class="count">×'+state.owned[f.name]+'</span><div class="face">'+f.face+'</div><strong>'+f.name+'</strong><small>'+f.rarity+'</small>';list.appendChild(d)})
}
function weightedPick(pool){let total=pool.reduce((s,f)=>s+f.weight,0),n=Math.random()*total;for(const f of pool){n-=f.weight;if(n<=0)return f}return pool[pool.length-1]}
let lastMode="basic";
function pull(mode){
if(mode==="basic"&&state.coins<100||mode==="mega"&&state.coins<400||mode==="super"&&state.gems<3){return}
if(mode==="basic")state.coins-=100;if(mode==="mega")state.coins-=400;if(mode==="super")state.gems-=3;
let pool=fighters.slice(),bonus=mode==="super"||mode==="mega";
if(bonus)pool=fighters.filter(f=>["レア","エピック","ミシック","レジェンド"].includes(f.rarity));
let f;
if(state.pity<=1){f=weightedPick(fighters.filter(x=>["ミシック","レジェンド"].includes(x.rarity)));state.pity=20}
else{f=weightedPick(pool);state.pity--}
state.pulls++;const duplicate=!!state.owned[f.name];state.owned[f.name]=(state.owned[f.name]||0)+1;
if(duplicate){const reward={"ノーマル":20,"レア":40,"エピック":80,"ミシック":150,"レジェンド":300}[f.rarity];state.coins+=reward}
showResult(f,duplicate);lastMode=mode;save()
}
function showResult(f,duplicate){
$("result").classList.add("show");$("result").scrollIntoView({behavior:"smooth",block:"nearest"});
$("resultFace").textContent=f.face;$("resultName").textContent=f.name;
$("resultTag").textContent=(f.rarity==="レジェンド"?"🌟 ":"✨ ")+f.rarity+"！";
$("resultTag").style.background=f.color;$("resultTag").style.color="#fff";
$("resultDesc").textContent=f.desc;
$("resultExtra").textContent=duplicate?"かぶり！ コインを獲得！ パワー "+state.owned[f.name]+"":"新しいファイターをゲット！";
if(f.rarity==="レジェンド")$("resultExtra").textContent="🎊 超激レア！！ おめでとう！ 🎊"
}
$("basic").onclick=()=>pull("basic");$("super").onclick=()=>pull("super");$("mega").onclick=()=>pull("mega");
$("ten").onclick=()=>{
if(state.coins<900)return;state.coins-=900;let results=[];
for(let i=0;i<10;i++){let pool=fighters;let f;if(state.pity<=1){f=weightedPick(fighters.filter(x=>["ミシック","レジェンド"].includes(x.rarity)));state.pity=20}else{f=weightedPick(pool);state.pity--}
state.pulls++;const dup=!!state.owned[f.name];state.owned[f.name]=(state.owned[f.name]||0)+1;if(dup)state.coins+=({"ノーマル":20,"レア":40,"エピック":80,"ミシック":150,"レジェンド":300}[f.rarity]);results.push(f)}
const best=results.reduce((a,b)=>fighters.indexOf(a)>fighters.indexOf(b)?a:b);
showResult(best,false);$("resultExtra").textContent="10連結果："+results.map(f=>f.face+f.name).join(" / ");lastMode="ten";save()
};
$("daily").onclick=()=>{if(state.daily)return;state.daily=true;state.coins+=250;state.gems+=2;$("result").classList.add("show");$("resultFace").textContent="🎁";$("resultTag").textContent="ログインボーナス";$("resultTag").style.background="#168cf0";$("resultName").textContent="ボーナスゲット！";$("resultDesc").textContent="250コイン ＋ 2ジェムを獲得！";$("resultExtra").textContent="また明日も遊びに来てね！";save()};
$("again").onclick=()=>{if(lastMode==="ten")pull("basic");else pull(lastMode)};
$("reset").onclick=()=>{if(confirm("集めたファイターやコインを全部リセットする？")){state={coins:500,gems:10,pulls:0,pity:20,owned:{},daily:false};$("result").classList.remove("show");save()}};
render();
</script></body></html>
